<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="lP3hxovqAq7WJnPxLm0JtIpXFez7lgq6jF0V_5w3Gco" />
<title>Sessiya+ — tələbə üçün testlər, elanlar və alətlər</title>
<meta name="description" content="Sessiya+ — Azərbaycan tələbələri üçün hər şey bir yerdə: imtahana hazırlıq testləri, otaq yoldaşı və mənzil elanları, kitablar, repetitorlar, bal kalkulyatoru.">
<meta name="theme-color" content="#2f5bea">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website"><meta property="og:site_name" content="Sessiya+">
<meta property="og:title" content="Sessiya+ — tələbə üçün hər şey bir yerdə">
<meta property="og:description" content="İmtahana hazırlıq testləri, otaq yoldaşı və mənzil, kitablar, repetitorlar və faydalı alətlər. Pulsuz.">
<meta property="og:image" content="%%BASE%%og.png"><meta property="og:url" content="%%BASE%%"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e3e6eb;--acc:#2f5bea;--acc2:#e9eefe;--ok:#16a34a;--okbg:#e9f8ef;--bad:#dc2626;--badbg:#fdecec}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;cursor:pointer}
.logo b{color:var(--acc)}
nav{display:flex;gap:4px;align-items:center}
nav a{font-size:14px;font-weight:600;color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:10px;cursor:pointer}
nav a.on{color:var(--ink);background:#e9ebef}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;font:600 12px Inter,sans-serif;padding:7px 9px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:#fff}
.muted{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:18px;margin:0 0 12px}
.drop{border:2px dashed #c9cfd8;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfc}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#eceef2;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 10px}
.btn.small{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bank,.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:#fff;transition:.15s}
.bank:hover,.tile:hover{border-color:var(--acc)}
.tile{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eceef2;color:var(--mute)}
.pill.acc{background:var(--acc2);color:var(--acc)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:150px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:6px;background:#e6e9ee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:9px;font:15px/1.4 Inter,sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:#b9c2d0}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:#eceef2;display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em}
.mistake{border-top:1px solid var(--line);padding:12px 0}
.mistake .y{color:var(--bad)} .mistake .c{color:var(--ok)}
.hide{display:none!important}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.stat{flex:1;min-width:120px;background:#f7f8fa;border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:10px}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}
.search{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;font:600 14px Inter,sans-serif;padding:10px 14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.ans{background:#f7f8fa;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.ans .lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.tkq{border-top:1px solid var(--line);padding:14px 0}
.tkq textarea{min-height:110px;margin-top:8px}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px;border:1px dashed var(--line);border-radius:12px}
a.tile{text-decoration:none;color:var(--ink)}
a.btn{text-decoration:none}
.gprow{display:grid;grid-template-columns:1fr 64px 64px 34px;gap:6px;margin-bottom:6px;align-items:center}
.gprow.hd span{font-size:12px;color:var(--mute)}
.gprow .btn{padding:8px 0}
mark{background:#fff1a8;color:inherit;border-radius:3px;padding:0 1px}
.tico{font-size:20px;margin-right:6px}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.hub a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;transition:.15s}
.hub a:hover{border-color:var(--acc);background:var(--acc2)}
.hub .hi{font-size:26px;display:block;margin-bottom:6px}.hub b{display:block;font-size:15px;line-height:1.25}.hub span.note{display:block;margin-top:4px;font-size:12.5px}
.hub a.main{grid-column:1/-1;background:var(--acc);border-color:var(--acc);color:#fff}.hub a.main .note{color:#dbe4ff}.hub a.main:hover{background:#2850d6}
.tabsbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabsbar a{flex:1;white-space:nowrap;text-align:center;text-decoration:none;font-weight:600;font-size:13.5px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer}
.tabsbar a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabbar{display:none}
.acbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;font-weight:600}
.acbtn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;object-fit:cover;flex:none}
@media (max-width:760px){header nav{display:none}.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;text-decoration:none;cursor:pointer;background:none!important}
.tabbar a .ti{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}.tabbar a.on{color:var(--acc)}.tabbar a.on .ti{filter:none;opacity:1}
body{padding-bottom:72px}}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.gate-in{max-width:460px;margin:0 auto;padding:22px 16px 40px}
html.gated body{overflow:hidden}
.gate-feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}.gate-feat span{background:#f7f8fa;border-radius:12px;padding:10px;font-size:13px;line-height:1.3}
.lbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.lbrow.me{border-color:var(--acc);background:var(--acc2)}.lbn{width:28px;text-align:center;font-weight:700;color:var(--mute)}.lbname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qzFav.on{color:#f59e0b}
.duscore{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f7f8fa;border-radius:14px;padding:12px 16px}
.duscore>div{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}.duscore b{font-size:30px;line-height:1.1}.duscore .vs{flex:none;font-weight:800;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;opacity:.45;filter:grayscale(1)}.badge.on{opacity:1;filter:none;border-color:#f5c451;background:#fffbea}
.badge span{font-size:26px;display:block}.badge b{display:block;font-size:13px;margin-top:4px}.badge small{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.about h3{margin:18px 0 6px;font-size:16px}.about p{margin:0 0 8px;line-height:1.55}
footer a{color:var(--mute)}
.gb{display:inline-block;min-width:26px;text-align:center;font-size:13px;font-weight:800;padding:3px 7px;border-radius:8px;color:#fff;vertical-align:middle}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .cn{font-size:12px;opacity:.6}
.ad{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
.adt{font-weight:700;font-size:17px;line-height:1.35;margin-top:8px}
.adm{gap:4px 12px;margin-top:4px;font-size:13px}
.adx{font-size:14px;line-height:1.5;white-space:pre-wrap;margin-top:8px;color:#30343b}
.price{font-size:17px;white-space:nowrap}
footer{font-size:12px;color:var(--mute);text-align:center;margin-top:30px;line-height:1.6}
@media (max-width:560px){h1{font-size:23px}.q{font-size:17px}.two{grid-template-columns:1fr}nav a{padding:7px 7px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo" id="logo">Sessiya<b>+</b></div>
  <nav><a data-go="home" data-i="nav_home"></a><a data-go="catalog" data-i="nav_catalog"></a><a data-go="board" data-i="nav_board"></a><a data-go="tools" data-i="nav_tools"></a><a data-go="profile" data-i="nav_profile"></a></nav>
  <div class="lang" id="lang"><button data-l="az">AZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
</header>

<!-- HOME -->
<section id="v-home">

  <div class="card">
    <h1 style="margin:0 0 6px" data-i="hub_title"></h1>
    <p class="muted" style="margin:0" data-i="hub_sub"></p>
    <div id="instBox" class="hide" style="margin-top:12px"><a class="btn hide" id="apkBtn" href="app/sessiya.apk" download="Sessiya.apk" style="width:100%;display:block;text-align:center;text-decoration:none" data-i="apk_btn"></a><div class="note hide" id="instHelp" style="margin-top:8px;background:var(--acc2);border-radius:10px;padding:10px 12px;color:var(--ink)"></div></div>
    <div class="hub">
      <a class="main" data-h="catalog"><span class="hi">📝</span><b data-i="hub_tests"></b><span class="note" data-i="hub_tests_d"></span></a>
      <a data-h="board"><span class="hi">🏠</span><b data-i="hub_ads"></b><span class="note" data-i="hub_ads_d"></span></a>
      <a data-h="tools"><span class="hi">🧮</span><b data-i="hub_tools"></b><span class="note" data-i="hub_tools_d"></span></a>
      <a data-h="rating"><span class="hi">🏆</span><b data-i="rating_title"></b><span class="note" data-i="hub_rating_d"></span></a>
      <a data-h="arena"><span class="hi">⚔️</span><b data-i="arena_title"></b><span class="note" data-i="hub_arena_d"></span></a>
    </div>
  </div>

  <div class="card" id="hmToday"></div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0" data-i="find_title"></h2><button class="btn ghost small" data-go="catalog" data-i="find_more"></button></div>
    <p class="note" style="margin:0 0 10px" data-i="find_sub"></p>
    <input type="text" class="search" id="hmSearch" autocomplete="off">
    <div class="grid" id="hmFound" style="margin-top:12px"></div>
  </div>
</section>

<!-- CATALOG -->
<section id="v-catalog" class="hide">
  <div class="tabsbar" id="tsTabs"><a data-h="catalog" data-v="cat">📚 <span data-i="ts_cat"></span></a><a data-h="mybanks" data-v="my">📂 <span data-i="ts_my"></span></a><a data-h="upload" data-v="up">⬆️ <span data-i="ts_up"></span></a></div>
  <div id="tsMy" class="hide">
  <div class="card">
    <h2 data-i="my_banks"></h2>
    <div class="grid" id="myBanks"></div>
    <div class="note" id="noBanks" data-i="no_banks"></div>
  </div>
  </div>
  <div id="tsUp" class="hide">
  <div class="card" id="hmUpload">
    <h2 style="margin:0 0 6px" data-i="hero_title"></h2>
    <p class="muted" style="margin:0 0 16px" data-i="hero_sub"></p>
    <div class="row" style="gap:16px;margin-bottom:12px;align-items:flex-end">
      <div><div class="note" style="margin-bottom:6px" data-i="f_type"></div><div class="seg" id="hmType"><button data-v="mc" data-i="type_mc"></button><button data-v="open" data-i="type_open"></button></div></div>
      <div id="hmFmtBox" class="hide"><div class="note" style="margin-bottom:6px" data-i="f_format"></div><div class="seg" id="hmFmt"><button data-v="written" data-i="fmt_written"></button><button data-v="test" data-i="fmt_test"></button></div></div>
    </div>
    <div class="note" id="hmHint" style="margin-bottom:12px"></div>
    <div class="drop" id="drop">
      <div style="font-size:30px">📄</div>
      <div style="font-weight:600;margin:6px 0 2px" data-i="drop_title"></div>
      <div class="note" data-i="drop_note"></div>
      <input type="file" id="file" accept=".pdf,.docx,.txt" class="hide">
    </div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="pasteToggle" data-i="paste_toggle"></button></div>
    <div id="pasteBox" class="hide" style="margin-top:6px">
      <textarea id="pasteText"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="pasteGo" data-i="paste_go"></button></div>
    </div>
    <div id="status" class="note" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2 data-i="formats_title"></h2>
    <div class="note" data-i="formats_body"></div>
  </div>

  </div>
  <div id="tsCat">
  <div class="card">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="catTitle" style="font-size:24px"></h1>
    <p class="note" id="catSub" style="margin-top:0"></p>
    <input type="text" class="search" id="catSearch">
    <div id="catList"></div>
    <div class="note" id="catNote" style="margin-top:12px"></div>
  </div>
  <div class="card" id="tsReady">
    <h2 data-i="ready_tests"></h2>
    <div class="grid" id="readyBanks"></div>
  </div>
  </div>
</section>

<!-- BOARD -->
<section id="v-board" class="hide">
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div style="flex:1;min-width:200px"><h1 style="font-size:24px" data-i="board_title"></h1><p class="note" style="margin:0" data-i="board_sub"></p></div>
      <button class="btn" id="bdPost" data-i="post_btn"></button></div>
    <div class="chips" id="bdCats" style="margin-top:14px"></div>
    <div class="seg hide" id="bdKind" style="margin-top:10px"></div>
    <div id="bdRoomF" class="hide" style="margin-top:10px"><div class="row"><div class="seg" id="bdSex"></div><input type="number" id="bdMax" inputmode="numeric" style="width:150px" data-ph="max_price_ph"></div></div>
    <input type="text" id="bdSearch" style="margin-top:10px" data-ph="board_search_ph">
  </div>
  <div id="bdList"></div>
  <div class="note" style="text-align:center;margin-top:6px" data-i="board_note"></div>
</section>

<!-- POST AD -->
<section id="v-post" class="hide">
  <div class="card">
    <div class="crumbs"><a data-h="board" data-i="board_title"></a></div>
    <h1 style="font-size:24px" data-i="post_title"></h1>
    <label class="f" data-i="f_cat"></label><div class="seg" id="poCat"></div>
    <div id="poKindBox"><label class="f" data-i="f_kind"></label><div class="seg" id="poKind"></div></div>
    <label class="f" data-i="f_title"></label><input type="text" id="poTitle" maxlength="80">
    <label class="f" data-i="f_text"></label><textarea id="poText" maxlength="1000" style="min-height:110px"></textarea>
    <div class="two">
      <div><label class="f" id="poPriceL"></label><input type="number" id="poPrice" inputmode="numeric" min="0" placeholder="250"></div>
      <div><label class="f" data-i="f_place"></label><input type="text" id="poPlace" list="placeList" maxlength="60" data-ph="place_ph"><datalist id="placeList"></datalist></div>
    </div>
    <div class="two">
      <div><label class="f" data-i="f_uni"></label><select id="poUni"></select></div>
      <div id="poSexBox"><label class="f" data-i="f_sex"></label><select id="poSex"></select></div>
    </div>
    <label class="f" data-i="f_contact"></label><input type="text" id="poContact" maxlength="60" placeholder="+994 50 123 45 67 / @telegram">
    <div class="note" style="margin-top:6px" data-i="contact_note"></div>
    <label class="row note" style="margin-top:14px;gap:8px;cursor:pointer;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="poAgree" style="margin-top:2px"> <span data-i="post_agree"></span></label>
    <div class="row" style="margin-top:14px"><button class="btn" id="poSave" data-i="post_publish"></button><button class="btn sec" id="poCancel" data-i="cancel"></button></div>
    <div class="note" id="poMsg" style="margin-top:10px"></div>
  </div>
</section>

<!-- TOOLS -->
<section id="v-tools" class="hide">
  <div class="card">
    <h1 style="font-size:24px" data-i="tools_title"></h1>
    <p class="note" style="margin-top:0" data-i="tools_sub"></p>
    <div class="seg" id="tlTabs"><button data-v="calc" data-i="tl_calc"></button><button data-v="gpa" data-i="tl_gpa"></button><button data-v="cal" data-i="tl_cal"></button><button data-v="pomo" data-i="tl_pomo"></button></div>
  </div>

/*PARSER*/

const UNIS=[
 ["unec","Azərbaycan Dövlət İqtisad Universiteti (UNEC)"],["bdu","Bakı Dövlət Universiteti (BDU)"],["aztu","Azərbaycan Texniki Universiteti (AzTU)"],

 ["adu","Azərbaycan Dillər Universiteti (ADU)"],["azmiu","Azərbaycan Memarlıq və İnşaat Universiteti (AzMİU)"],["wcu","Qərbi Kaspi Universiteti (WCU)"],
 ["xezer","Xəzər Universiteti"],["ada","ADA Universiteti"],["bmu","Bakı Mühəndislik Universiteti (BMU)"],["bhos","Bakı Ali Neft Məktəbi (BANM)"],
 ["bsu","Bakı Slavyan Universiteti (BSU)"],["au","Azərbaycan Universiteti"],["oyu","Odlar Yurdu Universiteti"],["maa","Milli Aviasiya Akademiyası (MAA)"],
 ["sdu","Sumqayıt Dövlət Universiteti (SDU)"],["gdu","Gəncə Dövlət Universiteti (GDU)"],["adau","Azərbaycan Dövlət Aqrar Universiteti (ADAU)"],["ndu","Naxçıvan Dövlət Universiteti (NDU)"]
];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mem={banks:store.get('sp_banks',[]),stats:store.get('sp_stats',{})};
function saveBanks(){store.set('sp_banks',mem.banks)} function saveStats(){store.set('sp_stats',mem.stats)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function slug(s){const m={ə:'e',Ə:'e',ı:'i',İ:'i',ö:'o',Ö:'o',ü:'u',Ü:'u',ş:'s',Ş:'s',ç:'c',Ç:'c',ğ:'g',Ğ:'g'};
  const ru='абвгдеёжзийклмнопрстуфхцчшщъыьэюя',la=['a','b','v','g','d','e','e','zh','z','i','y','k','l','m','n','o','p','r','s','t','u','f','h','ts','ch','sh','sch','','y','','e','yu','ya'];
  return String(s||'').split('').map(c=>m[c]??c).join('').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('').map(c=>m[c]??(ru.indexOf(c)>=0?la[ru.indexOf(c)]:c)).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x'}
function uniName(id){const u=UNIS.find(x=>x[0]===id);return u?u[1]:id}

// ---------- i18n ----------
let LANG=store.get('sp_lang',null)||((navigator.language||'').startsWith('ru')?'ru':'az');
function t(k,...a){let s=(I18N[LANG]&&I18N[LANG][k])??I18N.az[k]??k; a.forEach((v,i)=>s=s.replace('{'+i+'}',v)); return s}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i); if(/<[a-z]/.test(v)) el.innerHTML=v; else el.textContent=v});
  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=t(el.dataset.ph));
  document.querySelectorAll('#lang button,#pfLang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  $('catSearch').placeholder=t('search_ph'); $('hmSearch').placeholder=t('find_ph'); $('bkSearch').placeholder=t('search_q_ph'); $('caSubj').placeholder=t('cal_subj_ph'); if(typeof HOME!=='undefined') renderHomeType();
  $('pvUniOther').placeholder=t('f_uni_other'); $('pvFac').placeholder=t('f_fac_ph'); $('pvSubj').placeholder=t('f_subj_ph');
  $('exCount').innerHTML=[25,50,100,0].map(n=>`<option value="${n}" ${n===50?'selected':''}>${n?t('n_questions',n):t('all_q')}</option>`).join('');

// Каталог = встроенные банки (data/catalog.json) + банки студентов (Firestore: banks + bankdata/{id}/parts)
const PUB_PER_DAY=5;
const Cat={db:null,staticMetas:[],userMetas:[],metas:[],ready:false,unsub:null,listeners:[],
  async init(){
    await this.loadStatic(); this.merge(); this.ready=true; this.emit();
    const fb=await fbStart(); if(!fb) return;
    try{ this.db=fb.firestore(); this.subscribe() }catch(e){ this.db=null }
    if(typeof pvSyncPublic==='function') pvSyncPublic();
  },
  async loadStatic(){
    try{ const r=await fetch('data/catalog.json',{cache:'no-cache'}); if(r.ok){ const j=await r.json(); this.staticMetas=(j.banks||[]).filter(m=>!m.hidden).map(m=>({...m,src:'static'})) } }catch(e){}
  },
  merge(){ this.metas=[...this.userMetas,...this.staticMetas] },
  subscribe(){
    this.unsub=this.db.collection('banks').orderBy('createdAt','desc').limit(1000).onSnapshot(s=>{
      this.stale=false; this.userMetas=s.docs.map(d=>({id:d.id,...d.data(),src:'user'})).filter(m=>!m.hidden); this.merge(); this.emit();
    },e=>{ this.err=e.code; this.stale=true; this.emit() });
  },
  on(f){this.listeners.push(f)}, emit(){this.listeners.forEach(f=>{try{f()}catch(e){}})},
  canRemove(m){ const u=FB.user; return !!(m&&m.src==='user'&&isReal(u)&&(m.uid===u.uid||isAdmin())) },
  async publish(b){
    if(!this.db||!isReal(FB.user)) throw {code:'no_db'};
    const lim=store.get('sp_publim',{}); const n=lim.day===dayKey()?lim.n:0; if(n>=PUB_PER_DAY) throw {code:'quota_exceeded'};
    const uid=FB.user.uid, id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const qs=b.qs.slice(0,3000).map(x=>b.type==='mc'?{q:String(x.q).slice(0,2000),o:x.o.map(o=>String(o).slice(0,1000)),a:x.a}:{q:String(x.q).slice(0,2000),ans:String(x.ans||'').slice(0,5000)});
    const chunks=[]; const per=150; for(let i=0;i<qs.length;i+=per) chunks.push(qs.slice(i,i+per));
    for(let k=0;k<chunks.length;k++){ await this.db.doc(`bankdata/${id}/parts/p${k}`).set({qs:chunks[k],uid}); }
    await this.db.doc('banks/'+id).set({name:String(b.name).slice(0,120),type:b.type||'mc',format:b.format||'test',uni:String(b.uni).slice(0,60),uniLabel:String(b.uniLabel||'').slice(0,120),
      fac:String(b.fac||'').slice(0,120),subj:String(b.subj||'').slice(0,120),lang:b.lang||'az',count:qs.length,parts:chunks.length,uid,author:String(FB.user.displayName||'').slice(0,60),createdAt:Date.now()});
    store.set('sp_publim',{day:dayKey(),n:n+1});
    return id;
  },
  async loadQs(meta){
    if(meta.src!=='user'){ const r=await fetch('data/banks/'+meta.id+'.json'); return r.ok?((await r.json()).qs||[]):[] }
    if(!this.db) throw 0;
    const out=[]; for(let k=0;k<(meta.parts||0);k++){const s=await this.db.doc(`bankdata/${meta.id}/parts/p${k}`).get(); if(s.exists) out.push(...(s.data().qs||[]))} return out;
  },
  async report(id,reason){ if(!this.db||!FB.user) return; await this.db.collection('reports').add({bank:id,reason:reason||'',uid:FB.user.uid,at:Date.now()}) },
  async remove(id){ await this.db.doc('banks/'+id).update({hidden:true}) }
};

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function pdfText(buf){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf}).promise; let out=[];
  for(let p=1;p<=doc.numPages;p++){
    $('status').textContent=t('reading_pdf',p,doc.numPages);
    const tc=await (await doc.getPage(p)).getTextContent();
    let lines=[],cur='',lastY=null;
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(lastY!==null && Math.abs(y-lastY)>2){lines.push(cur);cur=''}
      cur+=(cur&&!cur.endsWith(' ')&&!it.str.startsWith(' ')?' ':'')+it.str; lastY=y;
      if(it.hasEOL){lines.push(cur);cur='';lastY=null}
    }
    if(cur)lines.push(cur); out.push(...lines);
  }
  return out.join('\n');
}
async function docxText(buf){
  if(!window.mammoth){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');}

}

}

$('pvSave').onclick=async()=>{
  const uniSel=$('pvUni').value, uniOther=$('pvUniOther').value.trim();
  const isMc=pending.type==='mc';
  const b={id:'b'+Date.now(),name:$('pvName').value.trim()||pending.name,type:isMc?'mc':'written',format:isMc?'test':pending.fmt,

    fac:$('pvFac').value.trim(), subj:$('pvSubj').value.trim()||$('pvName').value.trim(), lang:$('pvLang').value};
  mem.banks.unshift(b); saveBanks();
  if($('pvPublic').checked){
    if(!b.uni||!b.subj){$('pvMsg').textContent=t('need_uni_subj');mem.banks.shift();saveBanks();return}

    catch(e){ $('pvSave').disabled=false; openBank(b.id); $('bkMsg').textContent=e&&e.code==='quota_exceeded'?t('pub_quota'):t('pub_fail'); return }
    $('pvSave').disabled=false;
  }
  openBank(b.id);
};

// ---------- bank ----------
let curBank=null;
function getLocal(id){return [...mem.banks,...READY_SETS].find(b=>b.id===id)}
function crumbsFor(m){ if(!m||!m.uni) return ''; const f=slug(m.fac||'umumi');
  return `<a data-h="catalog">${t('nav_catalog')}</a> › <a data-h="u-${m.uni}">${esc(m.uniLabel||uniName(m.uni))}</a> › <a data-h="f-${m.uni}--${f}">${esc(m.fac||t('general'))}</a> › <a data-h="s-${m.uni}--${f}--${slug(m.subj||m.name)}">${esc(m.subj||m.name)}</a>`}
function fillBankHeader(b,shared){
  const st=mem.stats[b.id]||{}; const W=b.type==='written';
  $('bkName').textContent=b.name; $('bkTotal').textContent=b.qs?b.qs.length:b.count;
  $('bkS2L').textContent=W?t('st_answered'):t('st_best'); $('bkS3L').textContent=W?t('st_unknown'):t('st_wrong');
  if(W){ $('bkBest').textContent=b.qs?b.qs.filter((x,i)=>getAns(b,i)).length:'—'; $('bkWrong').textContent=(st.unknown||[]).length; $('bkCardsUnk').disabled=!(st.unknown||[]).length;
    const noAns=b.qs&&b.qs.every((x,i)=>!x.ans); $('bkAnsNote').textContent=noAns?t('ans_missing_note'):''; }
  else { $('bkBest').textContent=st.best!=null?st.best+'%':'—'; $('bkWrong').textContent=(st.wrong||[]).length; }
  $('bkMistakes').disabled=!(st.wrong||[]).length;
  $('bkCrumbs').innerHTML=crumbsFor(b);
  const langName={az:'Azərbaycan dili',ru:'Русский',en:'English'};
  $('bkTags').innerHTML=[b.lang?`<span class="pill">${langName[b.lang]||b.lang}</span>`:'',b.tag?`<span class="pill acc">${t('ready_tag')}</span>`:'',W?`<span class="pill">${b.format==='test'?t('test_noopts_tag'):t('written_tag')}</span>`:'',shared||b.sharedId?`<span class="pill acc">${t('in_catalog')}</span>`:''].join('');
  $('bkShare').classList.toggle('hide',!(shared?b.id:b.sharedId)); $('bkReport').classList.toggle('hide',!shared); $('bkDelete').classList.toggle('hide',!!b.tag||(shared&&!Cat.canRemove(b)));
  $('bkMsg').textContent='';
}
function openBank(id){
  const b=getLocal(id); if(!b) return go('mybanks');
  curBank=b; curBank.shared=false; fillBankHeader(b,false); $('bkLoading').classList.add('hide'); showModes();
  if(location.hash!=='#bank') history.replaceState(null,'','#bank'); show('bank');
}
async function openShared(id){
  const m=Cat.metas.find(x=>x.id===id);
  if(!m){ curBank=null; show('bank'); $('bkName').textContent=''; $('bkCrumbs').innerHTML=''; $('bkTags').innerHTML='';
    $('bkModes').classList.add('hide'); $('bkWModes').classList.add('hide'); $('bkSearchBox').classList.add('hide'); $('bkShare').classList.add('hide'); $('bkLoading').classList.remove('hide'); $('bkLoading').textContent=Cat.ready?t('not_found'):t('loading'); return }
  curBank={...m,shared:true,qs:null}; fillBankHeader(curBank,true); show('bank'); $('bkSearchBox').classList.add('hide');
  $('bkModes').classList.add('hide'); $('bkWModes').classList.add('hide'); $('bkLoading').classList.remove('hide'); $('bkLoading').textContent=t('loading');
  try{ curBank.qs=await Cat.loadQs(m); }catch(e){ curBank.qs=[] }
  if(!curBank.qs.length){$('bkLoading').textContent=t('load_fail');return}
  $('bkTotal').textContent=curBank.qs.length; $('bkLoading').classList.add('hide'); fillBankHeader(curBank,true); showModes();
}
function showModes(){ const W=curBank&&curBank.type==='written'; const fv=curBank?favs(curBank.id).length:0; $('bkFav').classList.toggle('hide',!fv); $('bkFav').textContent=t('fav_btn',fv); $('bkModes').classList.toggle('hide',W); $('bkWModes').classList.toggle('hide',!W); $('bkSearch').value=''; $('bkSearchRes').innerHTML=''; $('bkSearchBox').classList.remove('hide'); }
$('bkDelete').onclick=async()=>{
  const btn=$('bkDelete'); if(btn.dataset.c!=='1'){btn.textContent=t('confirm_delete');btn.dataset.c='1';setTimeout(()=>{btn.textContent=t('delete');btn.dataset.c=''},3000);return}
  btn.dataset.c=''; btn.textContent=t('delete');
  if(curBank.shared){ try{await Cat.remove(curBank.id)}catch(e){$('bkMsg').textContent=t('pub_fail');return} return go('catalog') }
  mem.banks=mem.banks.filter(b=>b.id!==curBank.id); delete mem.stats[curBank.id]; saveBanks(); saveStats(); go('mybanks');
};
$('bkReport').onclick=async()=>{ try{await Cat.report(curBank.id,'')}catch(e){} $('bkMsg').textContent=t('reported'); $('bkReport').disabled=true };
$('bkPractice').onclick=()=>startQuiz('practice',curBank.qs.map((_,i)=>i));
$('bkDuel').onclick=()=>{ const m=Cat.metas.find(x=>x.id===curBank.id)||(curBank.qs&&{id:curBank.id,name:curBank.name,subj:curBank.subj||curBank.name}); if(!m) return; if(!bankCache[m.id]&&curBank.qs) bankCache[m.id]=curBank.qs; duelFromBank(m,$('bkDuel')) };
$('bkFav').onclick=()=>startQuiz('practice',favs(curBank.id).slice());
$('bkPracticeRnd').onclick=()=>startQuiz('practice',shuffle(curBank.qs.map((_,i)=>i)));
$('bkMistakes').onclick=()=>startQuiz('practice',shuffle((mem.stats[curBank.id]||{}).wrong||[]));
$('bkExam').onclick=()=>{const n=+$('exCount').value;let ids=shuffle(curBank.qs.map((_,i)=>i));if(n)ids=ids.slice(0,n);startQuiz('exam',ids,+$('exTime').value)};

// ---------- quiz ----------
let Q=null,tick=null;
function startQuiz(mode,ids,minPerQ=0){
  ids=ids.filter(i=>i<curBank.qs.length); if(!ids.length)return;
  Q={mode,ids,i:0,answers:[],start:Date.now(),minPerQ,limit:minPerQ?Math.round(ids.length*minPerQ*60):0};
  clearInterval(tick); if(Q.limit){tick=setInterval(updTimer,500)} updTimer();
  show('quiz'); renderQ();
}
function updTimer(){
  if(!Q||!Q.limit){$('qzTimer').textContent='';return}
  const left=Math.max(0,Q.limit-Math.floor((Date.now()-Q.start)/1000));
  $('qzTimer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  $('qzTimer').style.color=left<60?'var(--bad)':'';
  if(left===0)finish();
}
function renderQ(){
  const x=curBank.qs[Q.ids[Q.i]];
  Q.order=shuffle(x.o.map((_,j)=>j)); Q.picked=null;
  $('qzPos').textContent=`${Q.i+1} / ${Q.ids.length} · `+(Q.mode==='exam'?t('exam_l'):t('practice_l'));
  $('qzBar').style.width=(Q.i/Q.ids.length*100)+'%';
  $('qzQ').textContent=x.q;
  $('qzOpts').innerHTML=Q.order.map((j,k)=>`<button class="opt" data-j="${j}"><span class="k">${k+1}</span><span>${esc(x.o[j])}</span></button>`).join('');
  $('qzOpts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  $('qzNext').disabled=true; $('qzNext').textContent=Q.i===Q.ids.length-1?t('finish'):t('next'); drawFavBtn();
}
function pick(j){
  const x=curBank.qs[Q.ids[Q.i]];
  if(Q.mode==='practice'&&Q.picked!==null)return;
  Q.picked=j;
  $('qzOpts').querySelectorAll('.opt').forEach(b=>{const bj=+b.dataset.j;b.classList.remove('sel');
    if(Q.mode==='practice'){b.disabled=true;if(bj===x.a)b.classList.add('ok');else if(bj===j)b.classList.add('bad')}
    else if(bj===j)b.classList.add('sel')});
  $('qzNext').disabled=false;
}
function next(){ if(Q.picked===null)return; Q.answers[Q.i]=Q.picked; bump(1); if(Q.picked===curBank.qs[Q.ids[Q.i]].a) award(10); if(Q.i<Q.ids.length-1){Q.i++;renderQ()}else finish(); }
$('qzNext').onclick=next;
$('qzStop').onclick=()=>{if(Q.picked!==null){Q.answers[Q.i]=Q.picked;bump(1);if(Q.picked===curBank.qs[Q.ids[Q.i]].a)award(10)}finish(true)};
$('qzFav').onclick=()=>{ if(!Q||curBank.daily) return; toggleFav(curBank.id,Q.ids[Q.i]); drawFavBtn(); syncBkFav() };
document.addEventListener('keydown',e=>{
  if($('v-quiz').classList.contains('hide'))return;
  if(e.key==='Enter'){next();return}
  const n=+e.key; if(n>=1&&n<=Q.order.length)pick(Q.order[n-1]);
});
function finish(early){
  clearInterval(tick);
  const done=Q.answers.length; let ok=0; const wrongIdx=[];
  Q.ids.forEach((qi,k)=>{ if(k>=done)return; const x=curBank.qs[qi]; if(Q.answers[k]===x.a)ok++; else wrongIdx.push(k)});
  const total=early?Math.max(done,1):Q.ids.length;
  const pct=Math.round(ok/total*100);
  const st=mem.stats[curBank.id]||{wrong:[]};
  const wrongSet=new Set(st.wrong||[]);
  Q.ids.forEach((qi,k)=>{if(k>=done)return; if(Q.answers[k]===curBank.qs[qi].a)wrongSet.delete(qi);else wrongSet.add(qi)});
  st.wrong=[...wrongSet]; if(Q.mode==='exam'&&!early) st.best=Math.max(st.best||0,pct);
  if(curBank.daily) dailyFinished(ok,total); else { mem.stats[curBank.id]=st; saveStats(); }
  const secs=Math.round((Date.now()-Q.start)/1000);
  $('rsScore').textContent=pct+'%';
  $('rsDetail').textContent=t('rs_detail',ok,total,Math.floor(secs/60),secs%60);
  $('rsList').innerHTML=wrongIdx.map(k=>{const x=curBank.qs[Q.ids[k]];return `<div class="mistake"><b>${esc(x.q)}</b><div class="note"><span class="y">${t('your_ans')}: ${esc(x.o[Q.answers[k]]??'—')}</span><br><span class="c">${t('correct')}: ${esc(x.o[x.a])}</span></div></div>`}).join('');
  $('rsListCard').classList.toggle('hide',!wrongIdx.length);
  $('rsMist').disabled=!st.wrong.length;
  show('result');
}
$('rsAgain').onclick=()=>startQuiz(Q.mode,shuffle(Q.ids),Q.minPerQ);
$('rsMist').onclick=()=>startQuiz('practice',shuffle((mem.stats[curBank.id]||{}).wrong||[]));
$('rsBack').onclick=()=>curBank.shared?go('b-'+curBank.id):openBank(curBank.id);

  document.querySelectorAll('#hmType button').forEach(b=>b.classList.toggle('on',b.dataset.v===HOME.type));
  document.querySelectorAll('#hmFmt button').forEach(b=>b.classList.toggle('on',b.dataset.v===HOME.fmt));
  $('hmFmtBox').classList.toggle('hide',HOME.type!=='open');

}
document.querySelectorAll('#hmType button').forEach(b=>b.onclick=()=>{HOME.type=b.dataset.v;store.set('sp_hmtype',HOME.type);renderHomeType()});
document.querySelectorAll('#hmFmt button').forEach(b=>b.onclick=()=>{HOME.fmt=b.dataset.v;store.set('sp_hmfmt',HOME.fmt);renderHomeType()});

// ---------- written banks: own answers, cards, ticket ----------
function myAnsKey(b){return 'sp_myans_'+b.id}
function getMyAns(b){return store.get(myAnsKey(b),{})}
function getAns(b,i){const x=b.qs&&b.qs[i];return (x&&x.ans)||getMyAns(b)[i]||''}
function setMyAns(b,i,v){const m=getMyAns(b); if(v) m[i]=v; else delete m[i]; store.set(myAnsKey(b),m)}
let C=null;
function startCards(ids){ if(!ids.length)return; C={ids,i:0,known:0,unknown:[],done:false}; $('cdDone').classList.add('hide'); $('cdBody').classList.remove('hide'); show('cards'); renderCard(); }
function renderCard(){
  const qi=C.ids[C.i], x=curBank.qs[qi];
  $('cdPos').textContent=`${C.i+1} / ${C.ids.length}`; $('cdBar').style.width=(C.i/C.ids.length*100)+'%';
  $('cdQ').textContent=x.q;
  $('cdAnsBox').classList.add('hide'); $('cdEdit').classList.add('hide'); $('cdShowRow').classList.remove('hide'); $('cdRateRow').classList.add('hide');
}
function revealCard(){
  const qi=C.ids[C.i], x=curBank.qs[qi], mine=getMyAns(curBank)[qi]||'';
  let html='';
  if(x.ans) html+=`<span class="lbl">${t('model_answer')}</span>${esc(x.ans)}`;
  if(mine) html+=`${x.ans?'<br><br>':''}<span class="lbl">${t('own_answer')}</span>${esc(mine)}`;
  if(!html) html=`<span class="lbl">${t('model_answer')}</span>${t('no_answer')}`;
  $('cdAns').innerHTML=html; $('cdMyAns').value=mine; $('cdMyAns').placeholder=t('your_answer_ph');
  $('cdEdit').classList.toggle('hide',!!(x.ans||mine));
  $('cdAnsBox').classList.remove('hide'); $('cdShowRow').classList.add('hide'); $('cdRateRow').classList.remove('hide');
}
function rateCard(knew){
  const qi=C.ids[C.i]; const st=mem.stats[curBank.id]||{}; const u=new Set(st.unknown||[]);
  bump(1); if(knew){C.known++;u.delete(qi);award(5)}else{C.unknown.push(qi);u.add(qi)} st.unknown=[...u]; mem.stats[curBank.id]=st; saveStats();
  if(C.i<C.ids.length-1){C.i++;renderCard()} else endCards();
}
function endCards(){ C.done=true; $('cdBody').classList.add('hide'); $('cdDone').classList.remove('hide'); $('cdBar').style.width='100%';
  $('cdScore').textContent=t('cards_done',C.known,C.ids.length); $('cdAgainUnk').disabled=!C.unknown.length; }
$('cdShow').onclick=revealCard; $('cdKnew').onclick=()=>rateCard(true); $('cdDidnt').onclick=()=>rateCard(false);
$('cdEditBtn').onclick=()=>$('cdEdit').classList.toggle('hide');
$('cdSaveAns').onclick=()=>{ setMyAns(curBank,C.ids[C.i],$('cdMyAns').value.trim()); revealCard(); };
$('cdStop').onclick=()=>{ if(C&&!C.done) endCards(); else backToBank(); };
$('cdAgainUnk').onclick=()=>startCards(shuffle(C.unknown));
$('cdBack').onclick=()=>backToBank();
function backToBank(){ curBank.shared?openShared(curBank.id):openBank(curBank.id) }
$('bkCards').onclick=()=>startCards(curBank.qs.map((_,i)=>i));
$('bkCardsRnd').onclick=()=>startCards(shuffle(curBank.qs.map((_,i)=>i)));
$('bkCardsUnk').onclick=()=>startCards(shuffle((mem.stats[curBank.id]||{}).unknown||[]));
document.addEventListener('keydown',e=>{ if($('v-cards').classList.contains('hide')||!C||C.done||e.target.tagName==='TEXTAREA')return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!$('cdShowRow').classList.contains('hide')) revealCard(); }
  else if(!$('cdRateRow').classList.contains('hide')){ if(e.key==='1')rateCard(true); if(e.key==='2')rateCard(false); } });
let TK=null,tkTick=null;
function startTicket(){
  const n=Math.min(+$('tkCount').value,curBank.qs.length); const mins=+$('tkTime').value;
  TK={ids:shuffle(curBank.qs.map((_,i)=>i)).slice(0,n),start:Date.now(),limit:mins*60,checked:false};
  $('tkTitle').textContent=t('ticket_title',n);
  $('tkList').innerHTML=TK.ids.map((qi,k)=>`<div class="tkq"><b>${k+1}. ${esc(curBank.qs[qi].q)}</b><textarea data-k="${k}" placeholder="${esc(t('your_answer_ph'))}"></textarea><div class="tkans hide"></div></div>`).join('');
  $('tkResult').classList.add('hide'); $('tkDoneRow').classList.remove('hide');
  clearInterval(tkTick); if(TK.limit) tkTick=setInterval(updTk,500); updTk(); show('ticket');
}
function updTk(){ if(!TK||!TK.limit||TK.checked){$('tkTimer').textContent='';return}
  const left=Math.max(0,TK.limit-Math.floor((Date.now()-TK.start)/1000));
  $('tkTimer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'); $('tkTimer').style.color=left<60?'var(--bad)':'';
  if(left===0) checkTicket(); }
function checkTicket(){
  if(TK.checked) return; TK.checked=true; bump([...document.querySelectorAll('#tkList textarea')].filter(x=>x.value.trim()).length); clearInterval(tkTick); $('tkTimer').textContent='';
  document.querySelectorAll('#tkList .tkq').forEach((el,k)=>{ const qi=TK.ids[k]; const model=curBank.qs[qi].ans||'', mine=getMyAns(curBank)[qi]||''; el.querySelector('textarea').readOnly=true;
    const box=el.querySelector('.tkans'); box.classList.remove('hide');
    box.innerHTML=`<div class="ans" style="margin-top:8px"><span class="lbl">${model||!mine?t('model_answer'):t('own_answer')}</span>${model?esc(model):(mine?esc(mine):t('no_answer'))}</div><label class="row note" style="margin-top:8px;gap:8px;cursor:pointer"><input type="checkbox" class="tkok"> ${t('i_answered_right')}</label>`; });
  document.querySelectorAll('.tkok').forEach(c=>c.onchange=scoreTicket); scoreTicket();
  $('tkDoneRow').classList.add('hide'); $('tkResult').classList.remove('hide');
}
function scoreTicket(){ const n=TK.ids.length, ok=[...document.querySelectorAll('.tkok')].filter(c=>c.checked).length; $('tkScore').textContent=`${ok} / ${n}`; }
$('bkTicket').onclick=startTicket; $('tkDone').onclick=checkTicket; $('tkAgain').onclick=startTicket; $('tkBack').onclick=()=>{clearInterval(tkTick);backToBank()};
