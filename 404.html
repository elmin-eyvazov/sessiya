<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="lP3hxovqAq7WJnPxLm0JtIpXFez7lgq6jF0V_5w3Gco" />
<title>Sessiya+ — tələbə üçün testlər, elanlar və alətlər</title>
<meta name="description" content="Sessiya+ — Azərbaycan tələbələri üçün hər şey bir yerdə: imtahana hazırlıq testləri, otaq yoldaşı və mənzil elanları, kitablar, repetitorlar, bal kalkulyatoru.">
<meta name="theme-color" content="#2f5bea">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website"><meta property="og:site_name" content="Sessiya+">
<meta property="og:title" content="Sessiya+ — tələbə üçün hər şey bir yerdə">
<meta property="og:description" content="İmtahana hazırlıq testləri, otaq yoldaşı və mənzil, kitablar, repetitorlar və faydalı alətlər. Pulsuz.">
<meta property="og:image" content="https://elmin-eyvazov.github.io/sessiya/og.png"><meta property="og:url" content="https://elmin-eyvazov.github.io/sessiya/"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e3e6eb;--acc:#2f5bea;--acc2:#e9eefe;--ok:#16a34a;--okbg:#e9f8ef;--bad:#dc2626;--badbg:#fdecec}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;cursor:pointer}
.logo b{color:var(--acc)}
nav{display:flex;gap:4px;align-items:center}
nav a{font-size:14px;font-weight:600;color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:10px;cursor:pointer}
nav a.on{color:var(--ink);background:#e9ebef}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;font:600 12px Inter,sans-serif;padding:7px 9px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:#fff}
.muted{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:18px;margin:0 0 12px}
.drop{border:2px dashed #c9cfd8;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfc}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#eceef2;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 10px}
.btn.small{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bank,.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:#fff;transition:.15s}
.bank:hover,.tile:hover{border-color:var(--acc)}
.tile{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eceef2;color:var(--mute)}
.pill.acc{background:var(--acc2);color:var(--acc)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:150px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:6px;background:#e6e9ee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:9px;font:15px/1.4 Inter,sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:#b9c2d0}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:#eceef2;display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em}
.mistake{border-top:1px solid var(--line);padding:12px 0}
.mistake .y{color:var(--bad)} .mistake .c{color:var(--ok)}
.hide{display:none!important}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.stat{flex:1;min-width:120px;background:#f7f8fa;border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:10px}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}
.search{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;font:600 14px Inter,sans-serif;padding:10px 14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.ans{background:#f7f8fa;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.ans .lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.tkq{border-top:1px solid var(--line);padding:14px 0}
.tkq textarea{min-height:110px;margin-top:8px}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px;border:1px dashed var(--line);border-radius:12px}
a.tile{text-decoration:none;color:var(--ink)}
a.btn{text-decoration:none}
.gprow{display:grid;grid-template-columns:1fr 64px 64px 34px;gap:6px;margin-bottom:6px;align-items:center}
.gprow.hd span{font-size:12px;color:var(--mute)}
.gprow .btn{padding:8px 0}
mark{background:#fff1a8;color:inherit;border-radius:3px;padding:0 1px}
.tico{font-size:20px;margin-right:6px}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.hub a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;transition:.15s}
.hub a:hover{border-color:var(--acc);background:var(--acc2)}
.hub .hi{font-size:26px;display:block;margin-bottom:6px}.hub b{display:block;font-size:15px;line-height:1.25}.hub span.note{display:block;margin-top:4px;font-size:12.5px}
.hub a.main{grid-column:1/-1;background:var(--acc);border-color:var(--acc);color:#fff}.hub a.main .note{color:#dbe4ff}.hub a.main:hover{background:#2850d6}
.about h3{margin:18px 0 6px;font-size:16px}.about p{margin:0 0 8px;line-height:1.55}
footer a{color:var(--mute)}
.gb{display:inline-block;min-width:26px;text-align:center;font-size:13px;font-weight:800;padding:3px 7px;border-radius:8px;color:#fff;vertical-align:middle}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .cn{font-size:12px;opacity:.6}
.ad{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
.adt{font-weight:700;font-size:17px;line-height:1.35;margin-top:8px}
.adm{gap:4px 12px;margin-top:4px;font-size:13px}
.adx{font-size:14px;line-height:1.5;white-space:pre-wrap;margin-top:8px;color:#30343b}
.price{font-size:17px;white-space:nowrap}
footer{font-size:12px;color:var(--mute);text-align:center;margin-top:30px;line-height:1.6}
@media (max-width:560px){h1{font-size:23px}.q{font-size:17px}.two{grid-template-columns:1fr}nav a{padding:7px 7px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo" id="logo">Sessiya<b>+</b></div>
  <nav><a data-go="home" data-i="nav_home"></a><a data-go="catalog" data-i="nav_catalog"></a><a data-go="board" data-i="nav_board"></a><a data-go="tools" data-i="nav_tools"></a></nav>
  <div class="lang" id="lang"><button data-l="az">AZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
</header>

<!-- HOME -->
<section id="v-home">
  <div class="card">
    <h1 style="margin:0 0 6px" data-i="hub_title"></h1>
    <p class="muted" style="margin:0" data-i="hub_sub"></p>
    <div id="instBox" class="hide" style="margin-top:12px"><div class="row" style="align-items:center;gap:10px;flex-wrap:nowrap"><button class="btn" id="instBtn" style="white-space:nowrap" data-i="install_btn"></button><span class="note" data-i="install_sub"></span></div><div class="note hide" id="instHelp" style="margin-top:8px;background:var(--acc2);border-radius:10px;padding:10px 12px;color:var(--ink)"></div></div>
    <div class="hub">
      <a class="main" data-h="catalog"><span class="hi">📝</span><b data-i="hub_tests"></b><span class="note" data-i="hub_tests_d"></span></a>
      <a data-h="board-room"><span class="hi">🏠</span><b data-i="hub_room"></b><span class="note" data-i="hub_room_d"></span></a>
      <a data-h="board"><span class="hi">📌</span><b data-i="hub_ads"></b><span class="note" data-i="hub_ads_d"></span></a>
      <a data-h="tools"><span class="hi">🧮</span><b data-i="hub_tools"></b><span class="note" data-i="hub_tools_d"></span></a>
      <a data-h="about"><span class="hi">ℹ️</span><b data-i="about_link"></b><span class="note" data-i="hub_about_d"></span></a>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0" data-i="find_title"></h2><button class="btn ghost small" data-go="catalog" data-i="find_more"></button></div>
    <p class="note" style="margin:0 0 10px" data-i="find_sub"></p>
    <input type="text" class="search" id="hmSearch" autocomplete="off">
    <div class="grid" id="hmFound" style="margin-top:12px"></div>
  </div>

  <div class="card" id="hmUpload">
    <h2 style="margin:0 0 6px" data-i="hero_title"></h2>
    <p class="muted" style="margin:0 0 16px" data-i="hero_sub"></p>
    <div class="row" style="gap:16px;margin-bottom:12px;align-items:flex-end">
      <div><div class="note" style="margin-bottom:6px" data-i="f_type"></div><div class="seg" id="hmType"><button data-v="mc" data-i="type_mc"></button><button data-v="open" data-i="type_open"></button></div></div>
      <div id="hmFmtBox" class="hide"><div class="note" style="margin-bottom:6px" data-i="f_format"></div><div class="seg" id="hmFmt"><button data-v="written" data-i="fmt_written"></button><button data-v="test" data-i="fmt_test"></button></div></div>
    </div>
    <div class="note" id="hmHint" style="margin-bottom:12px"></div>
    <div class="drop" id="drop">
      <div style="font-size:30px">📄</div>
      <div style="font-weight:600;margin:6px 0 2px" data-i="drop_title"></div>
      <div class="note" data-i="drop_note"></div>
      <input type="file" id="file" accept=".pdf,.docx,.txt" class="hide">
    </div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="pasteToggle" data-i="paste_toggle"></button></div>
    <div id="pasteBox" class="hide" style="margin-top:6px">
      <textarea id="pasteText"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="pasteGo" data-i="paste_go"></button></div>
    </div>
    <div id="status" class="note" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0" data-i="prog_title"></h2><button class="btn ghost small" data-go="tools" data-i="all_tools"></button></div>
    <div class="row">
      <div class="stat"><span class="note" data-i="prog_streak"></span><b id="prStreak"></b></div>
      <div class="stat"><span class="note" data-i="prog_today"></span><b id="prToday"></b></div>
      <div class="stat"><span class="note" data-i="prog_total"></span><b id="prTotal"></b></div>
      <div class="stat"><span class="note" data-i="prog_next"></span><b id="prNext" style="font-size:16px"></b></div>
    </div>
    <div class="note" id="prTip" style="margin-top:10px"></div>
    <div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
      <a class="tile" data-h="tools-calc"><span><span class="tico">🧮</span><b data-i="tl_calc"></b></span></a>
      <a class="tile" data-h="tools-gpa"><span><span class="tico">🎓</span><b data-i="tl_gpa"></b></span></a>
      <a class="tile" data-h="tools-cal"><span><span class="tico">📅</span><b data-i="tl_cal"></b></span></a>
      <a class="tile" data-h="tools-pomo"><span><span class="tico">🍅</span><b data-i="tl_pomo"></b></span></a>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0" data-i="board_title"></h2><button class="btn ghost small" data-go="board" data-i="see_all"></button></div>
    <p class="note" style="margin:0 0 12px" data-i="home_board_sub"></p>
    <div class="grid" id="hbTiles" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))"></div>
    <div class="row" style="margin-top:12px"><a class="btn small" data-h="post-room" data-i="post_btn"></a></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0" data-i="catalog_title"></h2><button class="btn ghost small" data-go="catalog" data-i="see_all"></button></div>
    <div class="grid" id="homeUnis"></div>
  </div>

  <div class="card">
    <h2 data-i="my_banks"></h2>
    <div class="grid" id="myBanks"></div>
    <div class="note" id="noBanks" data-i="no_banks"></div>
  </div>

  <div class="card">
    <h2 data-i="ready_tests"></h2>
    <div class="grid" id="readyBanks"></div>
  </div>

  <div class="card">
    <h2 data-i="formats_title"></h2>
    <div class="note" data-i="formats_body"></div>
  </div>
</section>

<!-- CATALOG -->
<section id="v-catalog" class="hide">
  <div class="card">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="catTitle" style="font-size:24px"></h1>
    <p class="note" id="catSub" style="margin-top:0"></p>
    <input type="text" class="search" id="catSearch">
    <div id="catList"></div>
    <div class="note" id="catNote" style="margin-top:12px"></div>
  </div>
</section>

<!-- BOARD -->
<section id="v-board" class="hide">
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div style="flex:1;min-width:200px"><h1 style="font-size:24px" data-i="board_title"></h1><p class="note" style="margin:0" data-i="board_sub"></p></div>
      <button class="btn" id="bdPost" data-i="post_btn"></button></div>
    <div class="chips" id="bdCats" style="margin-top:14px"></div>
    <div class="seg hide" id="bdKind" style="margin-top:10px"></div>
    <div id="bdRoomF" class="hide" style="margin-top:10px"><div class="row"><div class="seg" id="bdSex"></div><input type="number" id="bdMax" inputmode="numeric" style="width:150px" data-ph="max_price_ph"></div></div>
    <input type="text" id="bdSearch" style="margin-top:10px" data-ph="board_search_ph">
  </div>
  <div id="bdList"></div>
  <div class="note" style="text-align:center;margin-top:6px" data-i="board_note"></div>
</section>

<!-- POST AD -->
<section id="v-post" class="hide">
  <div class="card">
    <div class="crumbs"><a data-h="board" data-i="board_title"></a></div>
    <h1 style="font-size:24px" data-i="post_title"></h1>
    <label class="f" data-i="f_cat"></label><div class="seg" id="poCat"></div>
    <div id="poKindBox"><label class="f" data-i="f_kind"></label><div class="seg" id="poKind"></div></div>
    <label class="f" data-i="f_title"></label><input type="text" id="poTitle" maxlength="80">
    <label class="f" data-i="f_text"></label><textarea id="poText" maxlength="1000" style="min-height:110px"></textarea>
    <div class="two">
      <div><label class="f" id="poPriceL"></label><input type="number" id="poPrice" inputmode="numeric" min="0" placeholder="250"></div>
      <div><label class="f" data-i="f_place"></label><input type="text" id="poPlace" list="placeList" maxlength="60" data-ph="place_ph"><datalist id="placeList"></datalist></div>
    </div>
    <div class="two">
      <div><label class="f" data-i="f_uni"></label><select id="poUni"></select></div>
      <div id="poSexBox"><label class="f" data-i="f_sex"></label><select id="poSex"></select></div>
    </div>
    <label class="f" data-i="f_contact"></label><input type="text" id="poContact" maxlength="60" placeholder="+994 50 123 45 67 / @telegram">
    <div class="note" style="margin-top:6px" data-i="contact_note"></div>
    <label class="row note" style="margin-top:14px;gap:8px;cursor:pointer;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="poAgree" style="margin-top:2px"> <span data-i="post_agree"></span></label>
    <div class="row" style="margin-top:14px"><button class="btn" id="poSave" data-i="post_publish"></button><button class="btn sec" id="poCancel" data-i="cancel"></button></div>
    <div class="note" id="poMsg" style="margin-top:10px"></div>
  </div>
</section>

<!-- TOOLS -->
<section id="v-tools" class="hide">
  <div class="card">
    <h1 style="font-size:24px" data-i="tools_title"></h1>
    <p class="note" style="margin-top:0" data-i="tools_sub"></p>
    <div class="seg" id="tlTabs"><button data-v="calc" data-i="tl_calc"></button><button data-v="gpa" data-i="tl_gpa"></button><button data-v="cal" data-i="tl_cal"></button><button data-v="pomo" data-i="tl_pomo"></button></div>
  </div>
  <div class="card hide" id="tl-calc">
    <h2 data-i="calc_title"></h2>
    <p class="note" style="margin-top:-6px" data-i="calc_sub"></p>
    <label class="f" data-i="calc_sem"></label>
    <input type="number" id="clSem" min="0" max="50" step="0.5" inputmode="decimal" placeholder="35">
    <div id="clTable" style="margin-top:12px"></div>
    <label class="f" data-i="calc_exam"></label>
    <input type="number" id="clExam" min="0" max="50" step="0.5" inputmode="decimal" placeholder="40">
    <div id="clFinal" style="margin-top:12px"></div>
  </div>
  <div class="card hide" id="tl-gpa">
    <h2 data-i="gpa_title"></h2>
    <p class="note" style="margin-top:-6px" data-i="gpa_sub"></p>
    <div id="gpRows"></div>
    <div class="row" style="margin-top:8px"><button class="btn sec small" id="gpAdd" data-i="gpa_add"></button></div>
    <div id="gpOut" style="margin-top:14px"></div>
  </div>
  <div class="card hide" id="tl-cal">
    <h2 data-i="cal_title"></h2>
    <p class="note" style="margin-top:-6px" data-i="cal_sub"></p>
    <div class="two"><div><label class="f" data-i="cal_subj"></label><input type="text" id="caSubj"></div><div><label class="f" data-i="cal_date"></label><input type="date" id="caDate"></div></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="caAdd" data-i="cal_add"></button></div>
    <div id="caList" style="margin-top:14px"></div>
  </div>
  <div class="card hide" id="tl-pomo" style="text-align:center">
    <h2 data-i="pomo_title"></h2>

<script>
// Test-bank text parser. Input: plain text (lines). Output: [{q, o:[...], a}]
function normLine(s){
  return s.replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/ә/g,'ə').replace(/Ә/g,'Ə').trim();
}
const QNUM=/^(\d{1,4})\s*[.)]\s*(?:Sual\s*:\s*)?(.*)$/i;
const MARK_OPT=/^([•●▪◦\-–√✓✔+])\s*(.*)$/;          // "• text" / "√ text"
const LETTER_OPT=/^([A-EА-Е])\s*(\)\)|\)|\.)\s*(.*)$/; // "A) text" / "C)) text"
const CORRECT_MARK=/[√✓✔+]/;

function parseBank(text){
  const raw=text.split(/\r?\n/).map(normLine).filter(l=>l.length);
  // drop page furniture
  const pre=raw.filter(l=>!/^\d{1,2}[./]\d{1,2}[./]\d{2,4}$/.test(l) && !/^\d+\/\d+$/.test(l));
  // drop runs (>=3) of consecutive integers (row-number columns from PDF tables)
  const drop=new Set();
  for(let i=0;i<pre.length;){
    let j=i; while(j+1<pre.length && /^\d{1,4}$/.test(pre[j]) && /^\d{1,4}$/.test(pre[j+1]) && +pre[j+1]===+pre[j]+1) j++;
    if(j-i>=2){ for(let k=i;k<=j;k++) drop.add(k); i=j+1; } else i++;
  }
  const lines=pre.filter((_,k)=>!drop.has(k));
  let out=[];
  out=parseMarked(lines); if(out.length>=3) return dedupe(out);
  out=parseLetter(lines); if(out.length>=3) return dedupe(out);
  out=parseTrailingBullet(lines);
  return dedupe(out);
}

// Format 1: "12. Question" + option lines starting with • (wrong) or √ (correct)
function parseMarked(lines){
  const res=[]; let cur=null;
  const flush=()=>{ if(cur && cur.o.length>=2 && cur.a>=0) res.push(cur); cur=null; };
  for(const l of lines){
    let m=l.match(MARK_OPT);
    if(m && cur){
      const isC=CORRECT_MARK.test(m[1]);
      if(m[2]==='' ){ cur.pending=isC; continue; }
      if(isC||cur.pending){ cur.a=cur.o.length; cur.pending=false; }
      cur.o.push(m[2]); cur.lastOpt=true; continue;
    }
    if(m && !cur) continue;
    const q=l.match(QNUM);
    if(q && q[2]){ flush(); cur={q:q[2],o:[],a:-1}; continue; }
    if(cur){
      if(cur.o.length===0) cur.q+=' '+l;            // question continues
      else if(cur.pending!==undefined && cur.o.length) cur.o[cur.o.length-1]+=' '+l; // option continues
    }
  }
  flush(); return res.map(clean);
}

// Format 2: "1) Sual: text" + "A) ..." options; correct marked as "C))" or option starting with + / √
function parseLetter(lines){
  const res=[]; let cur=null;
  const flush=()=>{ if(cur && cur.o.length>=2 && cur.a>=0) res.push(cur); cur=null; };
  for(const l of lines){
    const q=l.match(QNUM);
    const lo=l.match(LETTER_OPT);
    if(lo && cur && !(q && !lo)){
      let t=lo[3]; let isC=lo[2]==='))';
      if(/^[√✓✔+]\s*/.test(t)){ isC=true; t=t.replace(/^[√✓✔+]\s*/,''); }
      if(/\s*[•√✓✔]$/.test(t)){ isC=true; t=t.replace(/\s*[•√✓✔]$/,''); }
      if(isC) cur.a=cur.o.length;
      cur.o.push(t); continue;
    }
    if(q && q[2]){ flush(); cur={q:q[2],o:[],a:-1}; continue; }
    if(cur){ if(cur.o.length===0) cur.q+=' '+l; else cur.o[cur.o.length-1]+=' '+l; }
  }
  flush(); return res.map(clean);
}

// Format 3: question line(s) followed by option lines, exactly one ends with "•"
function isQ(l){ return /[?:]$/.test(l) || /^Sual\s*:/i.test(l); }
function parseTrailingBullet(lines){
  const res=[]; let i=0; let qbuf=[];
  const hasQ=lines.filter(isQ).length>=3;
  if(hasQ){
    while(i<lines.length){
      if(isQ(lines[i])){
        const q=lines[i].replace(QNUM,'$2'); const o=[]; let j=i+1;
        while(j<lines.length && !isQ(lines[j]) && o.length<8){ o.push(lines[j]); j++; }
        const marked=o.filter(x=>/•$/.test(x));
        // drop leading continuation lines of the question (question may wrap): keep last 6 options max
        if(marked.length===1 && o.length>=2){
          const opts=o.slice(-Math.min(o.length,6));
          const a=opts.findIndex(x=>/•$/.test(x));
          if(a>=0) res.push(clean({q, o:opts.map(x=>x.replace(/\s*•$/,'')), a}));
        }
        i=j; continue;
      }
      i++;
    }
    return res;
  }
  while(i<lines.length){
    let best=null;
    for(const k of [5,4,3,6]){
      const grp=lines.slice(i,i+k); if(grp.length<k) continue;
      if(grp.filter(x=>/•$/.test(x)).length===1 && !grp.some(isQ) && grp.every(x=>x.length<=160)){ best=grp; break; }
    }
    if(best && qbuf.length){
      res.push(clean({q:qbuf.join(' ').replace(QNUM,'$2'),o:best.map(x=>x.replace(/\s*•$/,'')),a:best.findIndex(x=>/•$/.test(x))}));
      qbuf=[]; i+=best.length; continue;
    }
    qbuf.push(lines[i]); if(qbuf.length>3) qbuf.shift(); i++;
  }
  return res;
}

function clean(x){
  return {q:x.q.replace(/\s+/g,' ').trim(), o:x.o.map(s=>s.replace(/\s+/g,' ').trim()), a:x.a};
}
function dedupe(arr){
  const seen=new Set(); return arr.filter(x=>{const k=x.q+'|'+x.o.join('|'); if(seen.has(k)) return false; seen.add(k); return x.q.length>2;});
}
if(typeof module!=='undefined') module.exports={parseBank};

// Question list without options: "1. Question" lines (+ optional "Cavab:/Ответ:/Answer:" answer)
function parseQuestionList(text){
  const lines=text.split(/\r?\n/).map(normLine).filter(l=>l.length);
  const START=/^(\d{1,3})\s*[.)]\s*(\S.*)$/; const ANS=/^(Cavab|Ответ|Answer|Javob)\s*[:\-–]\s*(.*)$/i;
  const res=[]; let cur=null, inAns=false;
  for(const l of lines){
    if(/^\d+\/\d+$/.test(l)) continue;
    const m=l.match(START);
    if(m && !(cur && inAns && +m[1]!==cur.n+1)){
      if(cur) res.push(cur); cur={n:+m[1],q:m[2],ans:''}; inAns=false; continue;
    }
    if(!cur) continue;
    const a=l.match(ANS);
    if(a){ inAns=true; cur.ans=(cur.ans?cur.ans+'\n':'')+a[2]; continue; }
    if(inAns) cur.ans+=(cur.ans?'\n':'')+l; else cur.q+=' '+l;
  }
  if(cur) res.push(cur);
  return res.map(x=>({q:x.q.replace(/\s+/g,' ').trim(),ans:x.ans.trim()})).filter(x=>x.q.length>2);
}
if(typeof module!=='undefined') module.exports.parseQuestionList=parseQuestionList;

function slug(s){const m={ə:'e',Ə:'e',ı:'i',İ:'i',ö:'o',Ö:'o',ü:'u',Ü:'u',ş:'s',Ş:'s',ç:'c',Ç:'c',ğ:'g',Ğ:'g'};

  return String(s||'').split('').map(c=>m[c]??c).join('').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('').map(c=>m[c]??(ru.indexOf(c)>=0?la[ru.indexOf(c)]:c)).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x'}

// ---------- shared catalog (db capability; local fallback) ----------
const Cat={db:null,user:null,canWrite:null,metas:[],ready:false,unsub:null,listeners:[],
  async init(){
    try{ if(!window.claude||!claude.use) throw 0;
      this.db=await claude.use('db'); this.user=await claude.use('user');
      if(this.user){ try{this.canWrite=await this.user.can('data.write')}catch(e){} try{this.isOwner=!!(await this.user.isOwner())}catch(e){} }
      if(this.db) this.subscribe();
    }catch(e){}
    if(!this.db){ await this.loadStatic(); this.ready=true; this.emit() }
  },
  async loadStatic(){
    try{ const r=await fetch('data/catalog.json',{cache:'no-cache'}); if(r.ok){ const j=await r.json(); this.metas=(j.banks||[]).filter(m=>!m.hidden); this.static=true } }catch(e){}
  },
  subscribe(){
    let timer=setTimeout(()=>{this.ready=true;this.stale=true;this.emit()},10000);
    this.unsub=this.db.collection('banks').orderBy('createdAt','desc').limit(1000).onSnapshot(s=>{
      if(!s.metadata.fromCache){clearTimeout(timer);this.stale=false}
      this.metas=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>!m.hidden); this.ready=true; this.emit();
    },e=>{clearTimeout(timer);this.ready=true;this.err=e.code;this.emit()});
  },
  on(f){this.listeners.push(f)}, emit(){this.listeners.forEach(f=>{try{f()}catch(e){}})},
  async publish(b){
    if(!this.db) throw {code:'no_db'};
    const id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const chunks=[]; const per=150; for(let i=0;i<b.qs.length;i+=per) chunks.push(b.qs.slice(i,i+per));
    for(let k=0;k<chunks.length;k++){ await this.db.doc(`bankdata/${id}/parts/p${k}`).set({qs:chunks[k]}); }
    await this.db.doc('banks/'+id).set({name:b.name,type:b.type||'mc',format:b.format||'test',uni:b.uni,uniLabel:b.uniLabel,fac:b.fac,subj:b.subj,lang:b.lang,count:b.qs.length,parts:chunks.length,createdAt:Date.now()});
    return id;
  },
  async loadQs(meta){
    if(this.static){ const r=await fetch('data/banks/'+meta.id+'.json'); return r.ok?((await r.json()).qs||[]):[] }
    const out=[]; for(let k=0;k<(meta.parts||0);k++){const s=await this.db.doc(`bankdata/${meta.id}/parts/p${k}`).get(); if(s.exists) out.push(...(s.data().qs||[]))} return out;
  },
  async report(id,reason){ if(!this.db) return; await this.db.collection('reports').add({bank:id,reason:reason||'',at:Date.now()}) },
  async remove(id){ await this.db.doc('banks/'+id).update({hidden:true}) }
};

// ---------- router (#home, #catalog, #u-<uni>, #f-<uni>--<fac>, #s-<uni>--<fac>--<subj>, #b-<id>) ----------
const VIEWS=['home','catalog','board','post','tools','about','preview','bank','quiz','result','cards','ticket'];
function show(v){for(const s of VIEWS) $('v-'+s).classList.toggle('hide',s!==v);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.go===v));
  window.scrollTo(0,0)}
function go(h){ if(location.hash==='#'+h) route(); else location.hash=h }
document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>go(a.dataset.go)); $('logo').onclick=()=>go('home');
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest('a[data-h]');if(a){e.preventDefault();go(a.dataset.h)}});
function route(){
  const h=location.hash.replace(/^#/,'')||'home'; let m;
  if(h==='home') return renderHome();
  if(h==='catalog') return renderCatalog({});
  if(h==='about') return renderAbout();
  if(m=h.match(/^board(?:-([a-z]+))?$/)) return renderBoard(m[1]);
  if(m=h.match(/^post(?:-([a-z]+))?$/)) return renderPost(m[1]);
  if(m=h.match(/^tools(?:-(calc|gpa|cal|pomo))?$/)) return renderTools(m&&m[1]);
  if(m=h.match(/^u-([a-z0-9-]+)$/)) return renderCatalog({uni:m[1]});
  if(m=h.match(/^f-([a-z0-9-]+?)--([a-z0-9-]+)$/)) return renderCatalog({uni:m[1],fac:m[2]});
  if(m=h.match(/^s-([a-z0-9-]+?)--([a-z0-9-]+?)--([a-z0-9-]+)$/)) return renderCatalog({uni:m[1],fac:m[2],subj:m[3]});
  if(m=h.match(/^b-([a-z0-9]+)$/)) return openShared(m[1]);
  renderHome();
}

  const words=nrm($('hmSearch').value.trim()).split(' ').filter(w=>w&&w!=='x');

  const hay=x=>nrm([x.m.name,x.m.subj,x.m.fac,x.m.uniLabel,x.m.lang==='ru'?'russkiy rus':''].join(' '));

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function pdfText(buf){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf}).promise; let out=[];
  for(let p=1;p<=doc.numPages;p++){
    $('status').textContent=t('reading_pdf',p,doc.numPages);
    const tc=await (await doc.getPage(p)).getTextContent();
    let lines=[],cur='',lastY=null;
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(lastY!==null && Math.abs(y-lastY)>2){lines.push(cur);cur=''}
      cur+=(cur&&!cur.endsWith(' ')&&!it.str.startsWith(' ')?' ':'')+it.str; lastY=y;
      if(it.hasEOL){lines.push(cur);cur='';lastY=null}
    }
    if(cur)lines.push(cur); out.push(...lines);
  }
  return out.join('\n');
}
async function docxText(buf){
  if(!window.mammoth){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');}
  return (await mammoth.extractRawText({arrayBuffer:buf})).value;
}
let pending=null;
async function handleFile(f){
  $('status').textContent=t('reading');
  try{
    const buf=await f.arrayBuffer(); let text='';
    if(/\.pdf$/i.test(f.name)) text=await pdfText(buf);
    else if(/\.docx$/i.test(f.name)) text=await docxText(buf);
    else text=new TextDecoder().decode(buf);
    handleText(text,f.name);
  }catch(e){$('status').textContent=t('read_fail')}
}
function guessLang(qs){const s=qs.slice(0,20).map(x=>x.q).join(' ');const cyr=(s.match(/[а-яё]/gi)||[]).length,az=(s.match(/[əğışçöü]/gi)||[]).length,lat=(s.match(/[a-z]/gi)||[]).length;return cyr>lat?'ru':(az>0?'az':'en')}

// ---------- quiz ----------
let Q=null,tick=null;
function startQuiz(mode,ids,minPerQ=0){
  ids=ids.filter(i=>i<curBank.qs.length); if(!ids.length)return;
  Q={mode,ids,i:0,answers:[],start:Date.now(),minPerQ,limit:minPerQ?Math.round(ids.length*minPerQ*60):0};
  clearInterval(tick); if(Q.limit){tick=setInterval(updTimer,500)} updTimer();
  show('quiz'); renderQ();
}
function updTimer(){
  if(!Q||!Q.limit){$('qzTimer').textContent='';return}
  const left=Math.max(0,Q.limit-Math.floor((Date.now()-Q.start)/1000));
  $('qzTimer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  $('qzTimer').style.color=left<60?'var(--bad)':'';
  if(left===0)finish();
}
function renderQ(){
  const x=curBank.qs[Q.ids[Q.i]];
  Q.order=shuffle(x.o.map((_,j)=>j)); Q.picked=null;
  $('qzPos').textContent=`${Q.i+1} / ${Q.ids.length} · `+(Q.mode==='exam'?t('exam_l'):t('practice_l'));
  $('qzBar').style.width=(Q.i/Q.ids.length*100)+'%';
  $('qzQ').textContent=x.q;
  $('qzOpts').innerHTML=Q.order.map((j,k)=>`<button class="opt" data-j="${j}"><span class="k">${k+1}</span><span>${esc(x.o[j])}</span></button>`).join('');
  $('qzOpts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  $('qzNext').disabled=true; $('qzNext').textContent=Q.i===Q.ids.length-1?t('finish'):t('next');
}
function pick(j){
  const x=curBank.qs[Q.ids[Q.i]];
  if(Q.mode==='practice'&&Q.picked!==null)return;
  Q.picked=j;
  $('qzOpts').querySelectorAll('.opt').forEach(b=>{const bj=+b.dataset.j;b.classList.remove('sel');
    if(Q.mode==='practice'){b.disabled=true;if(bj===x.a)b.classList.add('ok');else if(bj===j)b.classList.add('bad')}
    else if(bj===j)b.classList.add('sel')});
  $('qzNext').disabled=false;
}
function next(){ if(Q.picked===null)return; Q.answers[Q.i]=Q.picked; bump(1); if(Q.i<Q.ids.length-1){Q.i++;renderQ()}else finish(); }
$('qzNext').onclick=next;
$('qzStop').onclick=()=>{if(Q.picked!==null){Q.answers[Q.i]=Q.picked;bump(1)}finish(true)};
document.addEventListener('keydown',e=>{
  if($('v-quiz').classList.contains('hide'))return;
  if(e.key==='Enter'){next();return}
  const n=+e.key; if(n>=1&&n<=Q.order.length)pick(Q.order[n-1]);
});
function finish(early){
  clearInterval(tick);
  const done=Q.answers.length; let ok=0; const wrongIdx=[];
  Q.ids.forEach((qi,k)=>{ if(k>=done)return; const x=curBank.qs[qi]; if(Q.answers[k]===x.a)ok++; else wrongIdx.push(k)});
  const total=early?Math.max(done,1):Q.ids.length;
  const pct=Math.round(ok/total*100);
  const st=mem.stats[curBank.id]||{wrong:[]};
  const wrongSet=new Set(st.wrong||[]);
  Q.ids.forEach((qi,k)=>{if(k>=done)return; if(Q.answers[k]===curBank.qs[qi].a)wrongSet.delete(qi);else wrongSet.add(qi)});
  st.wrong=[...wrongSet]; if(Q.mode==='exam'&&!early) st.best=Math.max(st.best||0,pct);
  mem.stats[curBank.id]=st; saveStats();
  const secs=Math.round((Date.now()-Q.start)/1000);
  $('rsScore').textContent=pct+'%';
  $('rsDetail').textContent=t('rs_detail',ok,total,Math.floor(secs/60),secs%60);

// ---------- activity / streak ----------
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getAct(){const a=store.get('sp_act',null);return a&&a.days?a:{days:{},total:0}}
function bump(n){ if(!(n>0)) return; const a=getAct(), k=dayKey(); a.days[k]=(a.days[k]||0)+n; a.total=(a.total||0)+n;
  const ks=Object.keys(a.days).sort(); if(ks.length>400) ks.slice(0,ks.length-400).forEach(x=>delete a.days[x]); store.set('sp_act',a) }
function streak(){ const a=getAct(); const d=new Date(); let n=0; if(!a.days[dayKey(d)]) d.setDate(d.getDate()-1);
  while(a.days[dayKey(d)]){ n++; d.setDate(d.getDate()-1) } return n }

// ---------- exams calendar helpers ----------
function exams(){ return store.get('sp_exams',[]) }
function daysTo(ds){ const [y,m,d]=ds.split('-').map(Number); const a=new Date(y,m-1,d), b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/86400000) }
function leftLabel(n){ return n<0?t('passed'):n===0?t('today_exam'):n===1?t('tomorrow'):t('days_left',n) }
function nextExam(){ return exams().map(e=>({...e,n:daysTo(e.d)})).filter(e=>e.n>=0).sort((a,b)=>a.n-b.n)[0] }
const MON={az:['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'],ru:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],en:['January','February','March','April','May','June','July','August','September','October','November','December']};
const WD={az:['B.','B.e.','Ç.a.','Ç.','C.a.','C.','Ş.'],ru:['вс','пн','вт','ср','чт','пт','сб'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
function fmtDate(ds){ const [y,m,d]=ds.split('-').map(Number); const dt=new Date(y,m-1,d); const L=MON[LANG]?LANG:'az';
  return `${d} ${MON[L][m-1]}${y!==new Date().getFullYear()?' '+y:''}, ${WD[L][dt.getDay()]}` }

function renderProgress(){

// score calculator (50 semester + 50 exam, exam >= 17)
const GRADES=[['A',91],['B',81],['C',71],['D',61],['E',51]];
const GCOL={A:'#16a34a',B:'#65a30d',C:'#ca8a04',D:'#ea580c',E:'#f97316',F:'#dc2626'};
function letter(total){ for(const [g,m] of GRADES) if(total>=m) return g; return 'F' }
function gb(g){ return `<span class="gb" style="background:${GCOL[g]}">${g}</span>` }
function numVal(v,max){ const x=parseFloat(String(v).replace(',','.')); return isNaN(x)?null:Math.min(max,Math.max(0,x)) }
function renderCalc(){
  const s=numVal($('clSem').value,50), e=numVal($('clExam').value,50);
  store.set('sp_calc',{s:$('clSem').value,e:$('clExam').value});
  $('clTable').innerHTML=s==null?`<div class="empty">${t('calc_empty')}</div>`:GRADES.map(([g,m])=>{
    const need=Math.max(17,Math.ceil(m-s)), imp=need>50;
    return `<div class="tile" style="cursor:default;margin-bottom:8px;${imp?'opacity:.55':''}"><span>${gb(g)} <span style="margin-left:6px">${t('g_'+g)}</span> <span class="note">${m}+</span></span><b style="${imp?'color:var(--bad)':''}">${imp?t('calc_imp'):t('calc_need',need)}</b></div>`}).join('');
  if(s==null||e==null){ $('clFinal').innerHTML=''; return }
  const tot=Math.round((s+e)*10)/10, g=e<17?'F':letter(tot);
  $('clFinal').innerHTML=`<div class="stat" style="text-align:center"><span class="note">${t('calc_total')}</span><b style="font-size:34px;margin:4px 0">${tot} ${gb(g)}</b><span class="note">${e<17?t('calc_fail_min'):t('g_'+g)}</span></div>`;
}

// GPA (ÜOMG) calculator
let GP=null;
function blankRow(){ return {n:'',c:'',s:''} }
function renderGpa(){
  if(!GP) GP=store.get('sp_gpa',null)||[blankRow(),blankRow(),blankRow()];
  $('gpRows').innerHTML=`<div class="gprow hd"><span>${t('gpa_subj')}</span><span>${t('gpa_cr')}</span><span>${t('gpa_score')}</span><span></span></div>`+
    GP.map((r,i)=>`<div class="gprow"><input type="text" data-r="${i}" data-k="n" value="${esc(r.n)}" placeholder="${esc(t('gpa_subj'))} ${i+1}"><input type="number" inputmode="decimal" data-r="${i}" data-k="c" value="${esc(r.c)}" placeholder="5"><input type="number" inputmode="decimal" data-r="${i}" data-k="s" value="${esc(r.s)}" placeholder="85"><button class="btn ghost small" data-del="${i}" aria-label="x">✕</button></div>`).join('');
  $('gpRows').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ GP[+inp.dataset.r][inp.dataset.k]=inp.value; store.set('sp_gpa',GP); gpaOut() });
  $('gpRows').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ GP.splice(+b.dataset.del,1); if(!GP.length) GP.push(blankRow()); store.set('sp_gpa',GP); renderGpa() });

function gpaOut(){
  let sum=0,cr=0,n=0; GP.forEach(r=>{ const c=numVal(r.c,100), s=numVal(r.s,100); if(c>0&&s!=null&&String(r.s).trim()!==''){ sum+=s*c; cr+=c; n++ } });
  if(!cr){ $('gpOut').innerHTML=''; return }
  const g=sum/cr;
  $('gpOut').innerHTML=`<div class="stat" style="text-align:center"><span class="note">${t('gpa_out')}</span><b style="font-size:34px;margin:4px 0">${g.toFixed(2)} ${gb(letter(g))}</b><span class="note">${t('gpa_meta',n,Math.round(cr*10)/10)}</span></div>`;
}

  [0,.35,.7].forEach(d=>{ const o=A.createOscillator(), g=A.createGain(); o.frequency.value=880; o.connect(g); g.connect(A.destination);
    g.gain.setValueAtTime(.25,A.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d+.3); o.start(A.currentTime+d); o.stop(A.currentTime+d+.32) }) }catch(e){} }

async function shareText(text,url){

  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
}

// ---------- search inside a bank ----------
const FOLD={ı:'i',ə:'e',ş:'s',ç:'c',ğ:'g',ö:'o',ü:'u',ё:'е'};
function lowq(s){ return String(s||'').replace(/[İI]/g,'i').toLowerCase().replace(/[ıəşçğöüё]/g,c=>FOLD[c]) }
function hl(s,q){ const i=lowq(s).indexOf(q); if(i<0||lowq(s).length!==s.length) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)) }
function renderSearch(){
  const q=lowq($('bkSearch').value.trim()), box=$('bkSearchRes');
  if(q.length<2||!curBank||!curBank.qs){ box.innerHTML=''; return }
  const W=curBank.type==='written', hits=[];
  curBank.qs.forEach((x,i)=>{ const a=W?getAns(curBank,i):x.o[x.a]; if(lowq(x.q).includes(q)||lowq(a).includes(q)) hits.push([x,a]) });
  box.innerHTML=hits.length?hits.slice(0,15).map(([x,a])=>`<div class="mistake"><b>${hl(x.q,q)}</b><div class="note c" style="margin-top:4px;white-space:pre-wrap">✓ ${a?hl(a,q):'—'}</div></div>`).join('')
    +(hits.length>15?`<div class="note" style="padding-top:8px">${t('search_more',hits.length-15)}</div>`:'')
    :`<div class="empty">${t('search_none')}</div>`;
}

const AD_DAYS=45, AD_PER_DAY=5;
const PLACES=['Yataqxana','28 May','Gənclik','Nəriman Nərimanov','Koroğlu','Qara Qarayev','Neftçilər','Xalqlar Dostluğu','Əhmədli','Həzi Aslanov','Sahil','İçərişəhər','Nizami','Elmlər Akademiyası','İnşaatçılar','20 Yanvar','Memar Əcəmi','Nəsimi (metro)','Azadlıq prospekti','Dərnəgül','Avtovağzal','8 Noyabr','Xocəsən','Cəfər Cabbarlı','Şah İsmayıl Xətai','Ulduz','Bakmil',
  'Yasamal r.','Nəsimi r.','Nərimanov r.','Səbail r.','Binəqədi r.','Xətai r.','Nizami r.','Sabunçu r.','Suraxanı r.','Xəzər r.','Qaradağ r.','Sumqayıt','Gəncə'];
const catIcon=c=>(AD_CATS.find(x=>x[0]===c)||[0,'📌'])[1];

function fbApi(db,B){ const FV=firebase.firestore.FieldValue; return {
  subscribe(cb,ecb){ const since=firebase.firestore.Timestamp.fromMillis(Date.now()-AD_DAYS*864e5);
    return db.collection('ads').where('createdAt','>',since).orderBy('createdAt','desc').limit(500).onSnapshot(
      s=>cb(s.docs.map(d=>{const x=d.data(); return {...x,id:d.id,createdAt:x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():Date.now()}})),ecb) },
  create(ad){ return db.collection('ads').add({...ad,uid:B.uid,createdAt:FV.serverTimestamp()}) },
  remove(id){ return db.collection('ads').doc(id).delete() },
  report(id){ return db.collection('reports').add({ad:id,uid:B.uid,at:FV.serverTimestamp()}) }
}}
function demoApi(B){ B.uid='demo'; const ls=[]; const get=()=>store.get('sp_demo_ads',[]); const put=v=>{store.set('sp_demo_ads',v); ls.forEach(f=>f(get()))};
  return { subscribe(cb){ ls.push(cb); setTimeout(()=>cb(get()),150) },
    async create(ad){ put([{...ad,uid:B.uid,id:'d'+Date.now().toString(36),createdAt:Date.now()},...get()]) },
    async remove(id){ put(get().filter(a=>a.id!==id)) }, async report(){} } }

const Board={api:null,ads:[],ready:false,err:null,uid:null,started:false,
  async init(){
    if(FB_CONFIG){
      try{ for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js']) if(!window.firebase||!firebase[f.split('-')[1]]) await loadScript(FB_SDK+f);
        if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
        const cred=await firebase.auth().signInAnonymously(); this.uid=cred.user.uid;
        this.api=fbApi(firebase.firestore(),this);
      }catch(e){ this.err='init'; this.api=null }
    } else if(/[?&]demo\b/.test(location.search)) this.api=demoApi(this);
    return this.api },
  async start(){ if(this.started) return; this.started=true;
    const api=await this.init(); if(!api){ this.ready=true; return boardRefresh() }
    api.subscribe(list=>{ this.ads=list.filter(a=>a.createdAt>Date.now()-AD_DAYS*864e5); this.ready=true; this.err=null; boardRefresh() },
      e=>{ this.err=(e&&e.code)||'err'; this.ready=true; boardRefresh() }) }
};
function boardRefresh(){ if(!$('v-board').classList.contains('hide')) renderAds(); if(!$('v-home').classList.contains('hide')) renderHomeBoard() }

// ---------- board view ----------
const BS={cat:'all',kind:'all',sex:'any',max:'',q:''};
function renderBoard(cat){
  cat=AD_CATS.some(x=>x[0]===cat)?cat:'all';
  if(cat!==BS.cat){ BS.cat=cat; BS.kind='all' }
  show('board'); document.title=(cat==='all'?t('board_title'):t('cat_'+cat))+' | Sessiya+';
  const cnt={}; Board.ads.forEach(a=>cnt[a.cat]=(cnt[a.cat]||0)+1);
  $('bdCats').innerHTML=[['all','🗂']].concat(AD_CATS).map(([c,ic])=>`<a class="chip ${c===BS.cat?'on':''}" data-h="${c==='all'?'board':'board-'+c}">${ic} ${t('cat_'+c)}${Board.ready&&(c==='all'?Board.ads.length:cnt[c])?` <span class="cn">${c==='all'?Board.ads.length:cnt[c]}</span>`:''}</a>`).join('');
  const kinds=AD_KINDS[BS.cat];
  $('bdKind').classList.toggle('hide',!kinds);
  if(kinds) $('bdKind').innerHTML=['all',...kinds].map(k=>`<button data-v="${k}" class="${k===BS.kind?'on':''}">${k==='all'?t('kinds_all'):t('kind_'+k)}</button>`).join('');
  $('bdKind').querySelectorAll('button').forEach(b=>b.onclick=()=>{BS.kind=b.dataset.v;renderBoard(BS.cat)});
  $('bdRoomF').classList.toggle('hide',BS.cat!=='room');
  $('bdSex').innerHTML=['any','f','m'].map(s=>`<button data-v="${s}" class="${s===BS.sex?'on':''}">${t('sex_'+s)}</button>`).join('');
  $('bdSex').querySelectorAll('button').forEach(b=>b.onclick=()=>{BS.sex=b.dataset.v;renderBoard(BS.cat)});
  $('bdPost').onclick=()=>go(BS.cat==='all'?'post':'post-'+BS.cat);
  renderAds(); Board.start();
}
function filteredAds(){
  const q=lowq(BS.q.trim()), max=parseFloat(BS.max);
  return Board.ads.filter(a=>(BS.cat==='all'||a.cat===BS.cat)&&(BS.kind==='all'||a.kind===BS.kind)
    &&(BS.cat!=='room'||BS.sex==='any'||!a.gender||a.gender==='any'||a.gender===BS.sex)
    &&(BS.cat!=='room'||!max||a.price==null||a.price<=max)
    &&(!q||lowq([a.title,a.text,a.place,a.uni].join(' ')).includes(q)));
}
function renderAds(){
  const box=$('bdList');
  if(!FB_CONFIG&&!Board.api&&Board.ready){ box.innerHTML=`<div class="empty">🚧 ${t('board_soon')}</div>`; return }
  if(!Board.ready){ box.innerHTML=`<div class="empty">${t('loading')}</div>`; return }
  if(Board.err&&!Board.ads.length){ box.innerHTML=`<div class="empty">${t('board_err')}</div>`; return }
  const L=filteredAds();
  box.innerHTML=L.length?L.map(adCard).join(''):`<div class="empty">${t('board_empty')}<div style="margin-top:10px"><button class="btn small" onclick="$('bdPost').click()">${t('post_btn')}</button></div></div>`;
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.c!=='1'){ b.textContent=t('confirm_delete'); b.dataset.c='1'; setTimeout(()=>{b.textContent=t('delete');b.dataset.c=''},3000); return }
    b.disabled=true; try{ await Board.api.remove(b.dataset.del) }catch(e){ b.disabled=false } });
  box.querySelectorAll('[data-rep]').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent=t('ad_reported'); try{ await Board.api.report(b.dataset.rep) }catch(e){} });
}
function ago(ms){ const m=Math.max(0,Math.floor((Date.now()-ms)/60000)); if(m<2) return t('ago_now'); if(m<60) return t('ago_min',m); const h=Math.floor(m/60); if(h<24) return t('ago_h',h); return t('ago_d',Math.floor(h/24)) }
function contactBtns(c){
  c=String(c||'').trim(); let d=c.replace(/\D/g,'');
  if(/^[+\d\s().-]+$/.test(c)&&d.length>=9){ if(d.length===10&&d[0]==='0') d='994'+d.slice(1); else if(d.length===9) d='994'+d;
    return `<a class="btn small" style="background:#1fa855" href="https://wa.me/${d}" target="_blank" rel="noopener">WhatsApp</a><a class="btn sec small" href="tel:+${d}">📞 ${esc(c)}</a>` }
  const tg=c.match(/^@([a-zA-Z][a-zA-Z0-9_]{3,31})$/);
  if(tg) return `<a class="btn small" style="background:#229ed9" href="https://t.me/${tg[1]}" target="_blank" rel="noopener">Telegram ${esc(c)}</a>`;
  return `<span class="pill" style="font-size:14px;padding:7px 12px">${esc(c)}</span>` }
function adCard(a){
  const own=Board.uid&&a.uid===Board.uid, room=a.cat==='room';
  const meta=[a.place?`📍 ${esc(a.place)}`:'',a.uni?`🎓 ${esc(a.uni)}`:'',room&&a.gender&&a.gender!=='any'?(a.gender==='f'?'👩 ':'👨 ')+t('sex_'+a.gender):'',`🕒 ${ago(a.createdAt)}`].filter(Boolean).map(s=>`<span>${s}</span>`).join('');
  return `<div class="ad"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:nowrap"><span class="pill acc">${catIcon(a.cat)} ${a.kind?t('kind_'+a.kind):t('cat_'+a.cat)}</span>${a.price!=null&&a.price!==''?`<b class="price">${a.price} ₼${room?t('per_month'):''}</b>`:''}</div>
  <div class="adt">${esc(a.title)}</div><div class="row note adm">${meta}</div>${a.text?`<div class="adx">${esc(a.text)}</div>`:''}
  <div class="row" style="margin-top:12px;gap:8px">${contactBtns(a.contact)}<span style="flex:1"></span>${own?`<button class="btn ghost small" data-del="${esc(a.id)}">${t('delete')}</button>`:`<button class="btn ghost small" style="color:var(--mute)" data-rep="${esc(a.id)}">${t('report')}</button>`}</div></div>` }

// ---------- home teaser ----------
function renderHomeBoard(){
  const cnt={}; Board.ads.forEach(a=>cnt[a.cat]=(cnt[a.cat]||0)+1);
  $('hbTiles').innerHTML=['room','sell','service','job'].map(c=>`<a class="tile" data-h="board-${c}"><span><span class="tico">${catIcon(c)}</span><b>${t('cat_'+c)}</b></span>${cnt[c]?`<span class="pill">${cnt[c]}</span>`:''}</a>`).join('');
}

// ---------- post form ----------
const PO={cat:'room',kind:'need_mate'};
function renderPost(cat){
  if(cat&&AD_CATS.some(x=>x[0]===cat)&&cat!==PO.cat){ PO.cat=cat; PO.kind=(AD_KINDS[cat]||[''])[0] }
  show('post'); document.title=t('post_title')+' | Sessiya+';
  $('poCat').innerHTML=AD_CATS.map(([c,ic])=>`<button data-v="${c}" class="${c===PO.cat?'on':''}">${ic} ${t('cat_'+c)}</button>`).join('');
  $('poCat').querySelectorAll('button').forEach(b=>b.onclick=()=>{PO.cat=b.dataset.v;PO.kind=(AD_KINDS[PO.cat]||[''])[0];renderPost()});
  const kinds=AD_KINDS[PO.cat]; $('poKindBox').classList.toggle('hide',!kinds);
  if(kinds){ $('poKind').innerHTML=kinds.map(k=>`<button data-v="${k}" class="${k===PO.kind?'on':''}">${t('kind_'+k)}</button>`).join('');
    $('poKind').querySelectorAll('button').forEach(b=>b.onclick=()=>{PO.kind=b.dataset.v;renderPost()}) }
  const room=PO.cat==='room';
  const sv=$('poSex').value||'any'; $('poSex').innerHTML=['any','f','m'].map(s=>`<option value="${s}">${t('sex_'+s)}</option>`).join(''); $('poSex').value=sv;
  $('poSexBox').classList.toggle('hide',!room); $('poPriceL').textContent=room?t('f_price_room'):t('f_price');
  $('poTitle').placeholder=t('ph_title_'+(room?PO.kind:PO.cat==='sell'?'sell':'gen')); $('poText').placeholder=room?t('ph_text_room'):t('ph_text_gen');
  if(!$('poContact').value) $('poContact').value=store.get('sp_contact','');
  $('poMsg').textContent=''; $('poSave').disabled=!Board.api&&Board.ready;
  if($('poSave').disabled) $('poMsg').textContent=t('board_soon');
  Board.start().then(()=>{ $('poSave').disabled=!Board.api; if(!Board.api) $('poMsg').textContent=t('board_soon') });
}
function initBoard(){
  $('placeList').innerHTML=PLACES.map(p=>`<option value="${esc(p)}">`).join('');
  $('poUni').innerHTML=`<option value="">—</option>`+UNIS.map(u=>{const s=(u[1].match(/\(([^)]+)\)/)||[0,u[1]])[1];return `<option value="${esc(s)}">${esc(u[1])}</option>`}).join('');
  $('bdSearch').oninput=()=>{BS.q=$('bdSearch').value;renderAds()}; $('bdMax').oninput=()=>{BS.max=$('bdMax').value;renderAds()};
  $('poCancel').onclick=()=>go(PO.cat?'board-'+PO.cat:'board');
  $('poSave').onclick=async()=>{
    const msg=$('poMsg'), title=$('poTitle').value.trim(), contact=$('poContact').value.trim(), pr=$('poPrice').value.trim();
    if(title.length<3) return msg.textContent=t('post_need_title');
    if(contact.length<5) return msg.textContent=t('post_need_contact');
    if(!$('poAgree').checked) return msg.textContent=t('post_need_agree');
    const lim=store.get('sp_postlim',{}); const n=lim.day===dayKey()?lim.n:0; if(n>=AD_PER_DAY) return msg.textContent=t('post_limit');
    const price=pr===''?null:Math.min(100000,Math.max(0,Math.round(parseFloat(pr.replace(',','.'))||0)));
    const ad={cat:PO.cat,kind:AD_KINDS[PO.cat]?PO.kind:'',title:title.slice(0,80),text:$('poText').value.trim().slice(0,1000),price,
      place:$('poPlace').value.trim().slice(0,60),uni:$('poUni').value,gender:PO.cat==='room'?$('poSex').value:'any',contact:contact.slice(0,60),lang:LANG};
    $('poSave').disabled=true; msg.textContent=t('post_wait');
    try{ await Board.api.create(ad) }catch(e){ $('poSave').disabled=false; msg.textContent=t('post_fail'); return }
    store.set('sp_postlim',{day:dayKey(),n:n+1}); store.set('sp_contact',contact);
    ['poTitle','poText','poPrice','poPlace'].forEach(id=>$(id).value=''); $('poAgree').checked=false; $('poSave').disabled=false;
    BS.kind='all'; BS.q=''; $('bdSearch').value=''; go('board-'+PO.cat);
  };
}

applyI18n(); renderHomeType(); initTools(); initBoard(); route(); Cat.init();
// ---------- install on phone (PWA) ----------
(function(){
  const ua=navigator.userAgent, isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const mobile=isIOS||/android|mobile/i.test(ua);
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  let ev=null; const box=$('instBox'), help=$('instHelp');
  const upd=()=>box.classList.toggle('hide',standalone()||!(ev||mobile));
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;upd()});
  addEventListener('appinstalled',()=>{ev=null;box.classList.add('hide')});
  $('instBtn').onclick=async()=>{
    if(ev){ ev.prompt(); try{ const r=await ev.userChoice; if(r.outcome==='accepted') box.classList.add('hide') }catch(e){} ev=null; return }
    help.textContent=t(isIOS?'install_ios':'install_other'); help.classList.toggle('hide');
  };
  upd();
})();
if('serviceWorker' in navigator && location.protocol==='https:') addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
