<style>
:root{--soft:#f6f7f9;--chip:#eceef1;--bg:#ffffff;--card:#ffffff;--ink:#16181d;--mute:#6b7280;--line:#e3e6eb;--acc:#2f5bea;--acc2:#e9eefe;--ok:#16a34a;--okbg:#e9f8ef;--bad:#dc2626;--badbg:#fdecec}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;cursor:pointer}

nav{display:flex;gap:4px;align-items:center}
nav a{font-size:14px;font-weight:600;color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:10px;cursor:pointer}

.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}

.lang button.on{background:var(--ink);color:#fff}
.muted{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:18px;margin:0 0 12px}
.drop{border:2px dashed #c9cfd8;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.15s;background:var(--soft)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#eceef2;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 10px}
.btn.small{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bank,.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--card);transition:.15s}
.bank:hover,.tile:hover{border-color:var(--acc)}
.tile{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eceef2;color:var(--mute)}
.pill.acc{background:var(--acc2);color:var(--acc)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:150px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:6px;background:#e6e9ee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:9px;font:15px/1.4 Inter,sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:#b9c2d0}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:#eceef2;display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 11px;font:14px/1.35 Inter,sans-serif;color:var(--ink);text-align:left;cursor:pointer;word-break:break-word;transition:opacity .25s,transform .15s}
.mt.a{background:var(--acc2)}
.mt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.mt.ok{border-color:var(--ok);background:var(--okbg);opacity:0;pointer-events:none;transform:scale(.96)}
.mt.bad{border-color:var(--bad);background:var(--badbg);animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tfq{font-size:19px;font-weight:700;line-height:1.35;margin:14px 0 12px;word-break:break-word}
.tfa{padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-size:17px;word-break:break-word}
.tfa.ok{background:var(--okbg);border-color:var(--ok)} .tfa.bad{background:var(--badbg);border-color:var(--bad)}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tfb .btn{padding:16px;font-size:17px}
.gmtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gmbig{font-size:44px;font-weight:800;text-align:center;margin:10px 0 4px}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em}
.mistake{border-top:1px solid var(--line);padding:12px 0}
.mistake .y{color:var(--bad)} .mistake .c{color:var(--ok)}
.hide{display:none!important}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.stat{flex:1;min-width:120px;background:var(--soft);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:10px}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}
.search{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;font:600 14px Inter,sans-serif;padding:10px 14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.ans{background:var(--soft);border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.ans .lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.tkq{border-top:1px solid var(--line);padding:14px 0}
.tkq textarea{min-height:110px;margin-top:8px}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px;border:1px dashed var(--line);border-radius:12px}
a.tile{text-decoration:none;color:var(--ink)}
a.btn{text-decoration:none}
.gprow{display:grid;grid-template-columns:1fr 64px 64px 34px;gap:6px;margin-bottom:6px;align-items:center}
.gprow.hd span{font-size:12px;color:var(--mute)}
.gprow .btn{padding:8px 0}
mark{background:#fff1a8;color:inherit;border-radius:3px;padding:0 1px}
.tico{font-size:20px;margin-right:6px}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.hub a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;transition:.15s}
.hub a:hover{border-color:var(--acc);background:var(--acc2)}
.hub .hi{font-size:26px;display:block;margin-bottom:6px}.hub b{display:block;font-size:15px;line-height:1.25}.hub span.note{display:block;margin-top:4px;font-size:12.5px}
.hub a.main{grid-column:1/-1;background:var(--acc);border-color:var(--acc);color:#fff}.hub a.main .note{color:#dbe4ff}.hub a.main:hover{background:#2850d6}
.tabsbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabsbar a{flex:1;white-space:nowrap;text-align:center;text-decoration:none;font-weight:600;font-size:13.5px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer}
.tabsbar a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabbar{display:none}
.acbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;font-weight:600}
.acbtn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;object-fit:cover;flex:none}
@media (max-width:760px){header nav{display:none}.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;text-decoration:none;cursor:pointer;background:none!important}
.tabbar a .ti{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}.tabbar a.on{color:var(--acc)}.tabbar a.on .ti{filter:none;opacity:1}
body{padding-bottom:72px}}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.gate-in{max-width:460px;margin:0 auto;padding:22px 16px 40px}
html.gated body{overflow:hidden}
.gate-feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}.gate-feat span{background:var(--soft);border-radius:12px;padding:10px;font-size:13px;line-height:1.3}
.lbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)}
.lbrow.me{border-color:var(--acc);background:var(--acc2)}.lbn{width:28px;text-align:center;font-weight:700;color:var(--mute)}.lbname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qzFav.on{color:#f59e0b}
.duscore{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:12px 16px}
.duscore>div{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}.duscore b{font-size:30px;line-height:1.1}.duscore .vs{flex:none;font-weight:800;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;opacity:.45;filter:grayscale(1)}.badge.on{opacity:1;filter:none;border-color:#f5c451;background:#fffbea}
.badge span{font-size:26px;display:block}.badge b{display:block;font-size:13px;margin-top:4px}.badge small{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
html.dark{--bg:#0f1115;--card:#181b21;--ink:#e8eaed;--mute:#9aa1ad;--line:#2a2f38;--acc:#5b84ff;--acc2:#1d2747;--okbg:#0f2e1c;--badbg:#3a1517;--soft:#20242c;--chip:#272c35;color-scheme:dark}
html.dark .lang button.on{color:#111}html.dark .toast{background:#e8eaed;color:#111}html.dark .opt .k{background:var(--chip);color:var(--ink)}html.dark .opt.ok .k{background:var(--ok);color:#fff}html.dark .opt.bad .k{background:var(--bad);color:#fff}html.dark .opt.sel .k{background:var(--acc);color:#fff}html.dark .badge.on{background:#2c2614;border-color:#7a6320}html.dark .drop{border-color:#3a404b}html.dark mark{background:#5c4d10}
html.dark .hub a.main{background:var(--acc);border-color:var(--acc)}html.dark .btn.sec{background:var(--chip);color:var(--ink)}html.dark .pill{background:var(--chip);color:var(--ink)}html.dark .pill.acc{background:var(--acc2);color:#b9c9ff}
.actchart{display:flex;align-items:flex-end;gap:4px;height:90px}.actchart div{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.actchart i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 2px 2px;min-height:2px}.actchart span{font-size:10px;color:var(--mute);margin-top:3px}
.about h3{margin:18px 0 6px;font-size:16px}.about p{margin:0 0 8px;line-height:1.55}
footer a{color:var(--mute)}
.gb{display:inline-block;min-width:26px;text-align:center;font-size:13px;font-weight:800;padding:3px 7px;border-radius:8px;color:#fff;vertical-align:middle}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .cn{font-size:12px;opacity:.6}
.aibox{background:linear-gradient(135deg,var(--acc2),var(--soft));border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.aibox .row{gap:8px;margin-top:10px}.aibar{height:6px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:10px}.aibar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.ed{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.ed.noans{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b inset}
.edh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:13px;color:var(--mute)}
.ed textarea{min-height:52px;font-size:15px}.ed .eda{min-height:70px;margin-top:6px}
.edo{display:flex;align-items:center;gap:8px;margin-top:6px}.edo input[type=radio]{width:20px;height:20px;flex:none;accent-color:var(--ok);margin:0}
.edo input[type=text]{flex:1;padding:8px 10px;font-size:14px}.edo.ok input[type=text]{border-color:var(--ok);background:var(--okbg)}
.ix{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 6px;line-height:1}.ix:hover{color:var(--bad)}
.aitag{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:6px;padding:1px 6px}
#pvFind{width:100%;max-width:240px;font:14px Inter,sans-serif;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:9px 12px}
@media (display-mode: standalone){.wrap{padding-top:calc(12px + env(safe-area-inset-top))}}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
input,textarea,select{font-size:16px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
footer{font-size:12px;color:var(--mute);text-align:center;margin-top:30px;line-height:1.6}
@media (max-width:560px){h1{font-size:23px}.q{font-size:17px}.two{grid-template-columns:1fr}nav a{padding:7px 7px;font-size:13px}}
</style>
</head>

<script>
// Test-bank text parser. Input: plain text (lines). Output: [{q, o:[...], a}]
function normLine(s){
  return s.replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/ә/g,'ə').replace(/Ә/g,'Ə').trim();
}
const QNUM=/^(\d{1,4})\s*[.)]\s*(?:Sual\s*:\s*)?(.*)$/i;
const MARK_OPT=/^([•●▪◦\-–√✓✔+])\s*(.*)$/;          // "• text" / "√ text"
const LETTER_OPT=/^([A-EА-Е])\s*(\)\)|\)|\.)\s*(.*)$/; // "A) text" / "C)) text"
const CORRECT_MARK=/[√✓✔+]/;

function parseBank(text){
  const raw=text.split(/\r?\n/).map(normLine).filter(l=>l.length);
  // drop page furniture
  const pre=raw.filter(l=>!/^\d{1,2}[./]\d{1,2}[./]\d{2,4}$/.test(l) && !/^\d+\/\d+$/.test(l));
  // drop runs (>=3) of consecutive integers (row-number columns from PDF tables)
  const drop=new Set();
  for(let i=0;i<pre.length;){
    let j=i; while(j+1<pre.length && /^\d{1,4}$/.test(pre[j]) && /^\d{1,4}$/.test(pre[j+1]) && +pre[j+1]===+pre[j]+1) j++;
    if(j-i>=2){ for(let k=i;k<=j;k++) drop.add(k); i=j+1; } else i++;
  }
  const lines=pre.filter((_,k)=>!drop.has(k));
  let out=[];
  const a=parseMarked(lines); if(a.length>=3) return dedupe(a);
  const b=parseLetter(lines); if(b.length>=3) return dedupe(b);
  const c=parseTrailingBullet(lines);
  // короткий тест (1–2 вопроса): берём формат, который нашёл больше всего вопросов
  return dedupe([c,b,a].sort((x,y)=>y.length-x.length)[0]);
}

// Format 1: "12. Question" + option lines starting with • (wrong) or √ (correct)
function parseMarked(lines){
  const res=[]; let cur=null;
  const flush=()=>{ if(cur && cur.o.length>=2 && cur.a>=0) res.push(cur); cur=null; };
  for(const l of lines){
    let m=l.match(MARK_OPT);
    if(m && cur){
      const isC=CORRECT_MARK.test(m[1]);
      if(m[2]==='' ){ cur.pending=isC; continue; }
      if(isC||cur.pending){ cur.a=cur.o.length; cur.pending=false; }
      cur.o.push(m[2]); cur.lastOpt=true; continue;
    }
    if(m && !cur) continue;
    const q=l.match(QNUM);
    if(q && q[2]){ flush(); cur={q:q[2],o:[],a:-1}; continue; }
    if(cur){
      if(cur.o.length===0) cur.q+=' '+l;            // question continues
      else if(cur.pending!==undefined && cur.o.length) cur.o[cur.o.length-1]+=' '+l; // option continues
    }
  }
  flush(); return res.map(clean);
}

// Format 2: "1) Sual: text" + "A) ..." options; correct marked as "C))" or option starting with + / √
function parseLetter(lines){
  const res=[]; let cur=null;
  const flush=()=>{ if(cur && cur.o.length>=2 && cur.a>=0) res.push(cur); cur=null; };
  for(const l of lines){
    const q=l.match(QNUM);
    const lo=l.match(LETTER_OPT);
    if(lo && cur && !(q && !lo)){
      let t=lo[3]; let isC=lo[2]==='))';
      if(/^[√✓✔+]\s*/.test(t)){ isC=true; t=t.replace(/^[√✓✔+]\s*/,''); }
      if(/\s*[•√✓✔]$/.test(t)){ isC=true; t=t.replace(/\s*[•√✓✔]$/,''); }
      if(isC) cur.a=cur.o.length;
      cur.o.push(t); continue;
    }
    if(q && q[2]){ flush(); cur={q:q[2],o:[],a:-1}; continue; }
    if(cur){ if(cur.o.length===0) cur.q+=' '+l; else cur.o[cur.o.length-1]+=' '+l; }
  }
  flush(); return res.map(clean);
}

// Format 3: question line(s) followed by option lines, exactly one ends with "•"
function isQ(l){ return /[?:]$/.test(l) || /^Sual\s*:/i.test(l); }
function parseTrailingBullet(lines){
  const res=[]; let i=0; let qbuf=[];
  const hasQ=lines.filter(isQ).length>=3;
  if(hasQ){
    while(i<lines.length){
      if(isQ(lines[i])){
        const q=lines[i].replace(QNUM,'$2'); const o=[]; let j=i+1;
        while(j<lines.length && !isQ(lines[j]) && o.length<8){ o.push(lines[j]); j++; }
        const marked=o.filter(x=>/•$/.test(x));
        // drop leading continuation lines of the question (question may wrap): keep last 6 options max
        if(marked.length===1 && o.length>=2){
          const opts=o.slice(-Math.min(o.length,6));
          const a=opts.findIndex(x=>/•$/.test(x));
          if(a>=0) res.push(clean({q, o:opts.map(x=>x.replace(/\s*•$/,'')), a}));
        }
        i=j; continue;
      }
      i++;
    }
    return res;
  }
  while(i<lines.length){
    let best=null;
    for(const k of [5,4,3,6]){
      const grp=lines.slice(i,i+k); if(grp.length<k) continue;
      if(grp.filter(x=>/•$/.test(x)).length===1 && !grp.some(isQ) && grp.every(x=>x.length<=160)){ best=grp; break; }
    }
    if(best && qbuf.length){
      res.push(clean({q:qbuf.join(' ').replace(QNUM,'$2'),o:best.map(x=>x.replace(/\s*•$/,'')),a:best.findIndex(x=>/•$/.test(x))}));
      qbuf=[]; i+=best.length; continue;
    }
    qbuf.push(lines[i]); if(qbuf.length>3) qbuf.shift(); i++;
  }
  return res;
}

function clean(x){
  return {q:x.q.replace(/\s+/g,' ').trim(), o:x.o.map(s=>s.replace(/\s+/g,' ').trim()), a:x.a};
}
function dedupe(arr){
  const seen=new Set(); return arr.filter(x=>{const k=x.q+'|'+x.o.join('|'); if(seen.has(k)) return false; seen.add(k); return x.q.length>2;});
}
if(typeof module!=='undefined') module.exports={parseBank};

// Question list without options: "1. Question" lines (+ optional "Cavab:/Ответ:/Answer:" answer)
function parseQuestionList(text){
  const lines=text.split(/\r?\n/).map(normLine).filter(l=>l.length);
  const START=/^(\d{1,3})\s*[.)]\s*(\S.*)$/; const ANS=/^(Cavab|Ответ|Answer|Javob)\s*[:\-–]\s*(.*)$/i;
  const res=[]; let cur=null, inAns=false;
  for(const l of lines){
    if(/^\d+\/\d+$/.test(l)) continue;
    const m=l.match(START);
    if(m && !(cur && inAns && +m[1]!==cur.n+1)){
      if(cur) res.push(cur); cur={n:+m[1],q:m[2],ans:''}; inAns=false; continue;
    }
    if(!cur) continue;
    const a=l.match(ANS);
    if(a){ inAns=true; cur.ans=(cur.ans?cur.ans+'\n':'')+a[2]; continue; }
    if(inAns) cur.ans+=(cur.ans?'\n':'')+l; else cur.q+=' '+l;
  }
  if(cur) res.push(cur);
  return res.map(x=>({q:x.q.replace(/\s+/g,' ').trim(),ans:x.ans.trim()})).filter(x=>x.q.length>2);
}
if(typeof module!=='undefined') module.exports.parseQuestionList=parseQuestionList;

hub_title:"Tələbə üçün hər şey — bir yerdə",hub_sub:"Sessiyaya hazırlıq: testlər, kartlar, imtahan biletləri, ağıllı təkrar, dostlarla duel və faydalı alətlər. Hamısı pulsuz.",hub_tests:"Testlər və imtahana hazırlıq",hub_tests_d:"Hazır testlər, öz bankını yüklə, kartlar və imtahan biletləri",hub_tools:"Alətlər",hub_tools_d:"Bal və ÜOMG kalkulyatoru, imtahan təqvimi, Pomodoro",hub_about_d:"Qaydalar, məxfilik, əlaqə",find_title:"Testlərdə axtar",find_sub:"Fənnin adını yaz — məsələn, «tarix», «riyaziyyat», «C++».",find_ph:"Fənn və ya test axtar…",find_none:"Heç nə tapılmadı. Öz bankını aşağıda yüklə.",find_more:"Bütün testlər →",about_link:"Sayt haqqında",about_html:"<p><b>Sessiya+</b> — Azərbaycan tələbələri üçün pulsuz sessiyaya hazırlıq platformasıdır: testlər, kartlar, imtahan biletləri, ağıllı təkrar, dostlarla duel, bal və ÜOMG kalkulyatoru.</p><h3>Necə işləyir</h3><p>Google və ya e-poçtla daxil ol. Hazır testləri «Testlər» bölməsində tap və ya öz test bankını (PDF, Word, mətn) yüklə — sayt onu interaktiv testə çevirəcək; çətin fayllarda süni intellekt strukturu özü tanıyır. İstəsən, testini hamı üçün kataloqa əlavə et.</p><h3>Məxfilik</h3><p>Biz yalnız hesabının adını və e-poçtunu saxlayırıq. Fayl brauzerində oxunur; «Süni intellektlə tanı» seçəndə faylın mətni emal üçün Google Gemini-yə göndərilir. Kataloqa yalnız sən özün əlavə etdiyin suallar düşür. İrəliləyişin hesabında saxlanılır ki, istənilən cihazdan davam edə biləsən. Hesabını istənilən vaxt «Profil» bölməsində silə bilərsən.</p><h3>Qaydalar</h3><p>Kataloqa spam, təhqir, başqasının şəxsi məlumatları və müəllif hüquqlarını pozan materiallar əlavə etmək qadağandır. Belə testləri «Şikayət et» düyməsi ilə bildir — onlar silinəcək.</p><h3>Testlər haqqında</h3><p>Hazır testlər Sessiya+ tərəfindən nümunə kimi tərtib olunub və rəsmi universitet banklarını əvəz etmir. Süni intellektin tərtib etdiyi cavablarda səhv ola bilər — yoxla. Tələbələrin əlavə etdiyi banklara görə onların müəllifləri məsuliyyət daşıyır.</p><p class=\"note\">Sessiya+ heç bir universitetlə əlaqəli deyil.</p>",

hub_title:"Всё для студента — в одном месте",hub_sub:"Подготовка к сессии: тесты, карточки, билеты, умное повторение, дуэли с друзьями и полезные инструменты. Всё бесплатно.",hub_tests:"Тесты и подготовка к экзаменам",hub_tests_d:"Готовые тесты, загрузка своего банка, карточки и билеты",hub_tools:"Инструменты",hub_tools_d:"Калькулятор баллов и среднего балла, календарь сессии, Помодоро",hub_about_d:"Правила, конфиденциальность, контакты",find_title:"Поиск по тестам",find_sub:"Напиши предмет — например, «история», «математика», «C++».",find_ph:"Найти предмет или тест…",find_none:"Ничего не найдено. Загрузи свой банк ниже.",find_more:"Все тесты →",about_link:"О сайте",about_html:"<p><b>Sessiya+</b> — бесплатная платформа подготовки к сессии для студентов Азербайджана: тесты, карточки, билеты, умное повторение, дуэли с друзьями, калькулятор баллов и среднего балла.</p><h3>Как это работает</h3><p>Войди через Google или почту. Найди готовые тесты в разделе «Тесты» или загрузи свой банк (PDF, Word, текст) — сайт превратит его в интерактивный тест; в сложных файлах структуру сам распознаёт искусственный интеллект. Если хочешь, добавь тест в общий каталог для всех.</p><h3>Конфиденциальность</h3><p>Мы храним только имя и почту аккаунта. Файл читается в браузере; если выбрать «Распознать с ИИ», текст файла отправляется на обработку в Google Gemini. В каталог попадают только вопросы, которые ты сам добавил. Прогресс сохраняется в аккаунте, чтобы продолжать с любого устройства. Аккаунт можно удалить в любой момент в «Профиле».</p><h3>Правила</h3><p>Запрещено добавлять в каталог спам, оскорбления, чужие личные данные и материалы с нарушением авторских прав. Сообщай о таком кнопкой «Пожаловаться» — это будет удалено.</p><h3>О тестах</h3><p>Готовые тесты составлены Sessiya+ как примеры и не заменяют официальные банки вузов. Ответы, составленные ИИ, могут содержать ошибки — проверяй. За банки, добавленные студентами, отвечают их авторы.</p><p class=\"note\">Sessiya+ не связан ни с одним университетом.</p>",

function safeMeta(m){ const str=(v,n)=>v==null||(typeof v==='string'&&v.length<=n);
  return /^[A-Za-z0-9_-]{3,40}$/.test(m.id)&&/^[a-z0-9_-]{1,60}$/.test(m.uni||'')&&typeof m.name==='string'&&m.name.length<=120

function slug(s){const m={ə:'e',Ə:'e',ı:'i',İ:'i',ö:'o',Ö:'o',ü:'u',Ü:'u',ş:'s',Ş:'s',ç:'c',Ç:'c',ğ:'g',Ğ:'g'};
  const ru='абвгдеёжзийклмнопрстуфхцчшщъыьэюя',la=['a','b','v','g','d','e','e','zh','z','i','y','k','l','m','n','o','p','r','s','t','u','f','h','ts','ch','sh','sch','','y','','e','yu','ya'];
  return String(s||'').split('').map(c=>m[c]??c).join('').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('').map(c=>m[c]??(ru.indexOf(c)>=0?la[ru.indexOf(c)]:c)).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x'}

// Каталог = встроенные банки (data/catalog.json) + банки студентов (Firestore: banks + bankdata/{id}/parts)
const PUB_PER_DAY=5;
const Cat={db:null,staticMetas:[],userMetas:[],metas:[],ready:false,unsub:null,listeners:[],
  async init(){
    await this.loadStatic(); this.merge(); this.ready=true; this.emit();
    setTimeout(()=>this.prefetch(),8000);
    const fb=await fbStart(); if(!fb) return;
    try{ this.db=fb.firestore(); this.subscribe() }catch(e){ this.db=null }
    if(typeof pvSyncPublic==='function') pvSyncPublic();
  },
  async loadStatic(){
    try{ const r=await fetch('data/catalog.json',{cache:'no-cache'}); if(r.ok){ const j=await r.json(); this.staticMetas=(j.banks||[]).filter(m=>!m.hidden).map(m=>({...m,src:'static'})) } }catch(e){}
  },
  merge(){ this.metas=[...this.userMetas,...this.staticMetas] },
  subscribe(){
    this.unsub=this.db.collection('banks').orderBy('createdAt','desc').limit(1000).onSnapshot(s=>{
      this.stale=false; this.userMetas=s.docs.map(d=>({...d.data(),id:d.id,src:'user'})).filter(m=>!m.hidden&&safeMeta(m)); this.merge(); this.emit();
    },e=>{ this.err=e.code; this.stale=true; this.emit() });
  },
  on(f){this.listeners.push(f)}, emit(){this.listeners.forEach(f=>{try{f()}catch(e){}})},
  canRemove(m){ const u=FB.user; return !!(m&&m.src==='user'&&isReal(u)&&(m.uid===u.uid||isAdmin())) },
  async publish(b){
    if(!this.db||!isReal(FB.user)) throw {code:'no_db'};
    const lim=store.get('sp_publim',{}); const n=lim.day===dayKey()?lim.n:0; if(n>=PUB_PER_DAY) throw {code:'quota_exceeded'};
    const uid=FB.user.uid, id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const qs=b.qs.slice(0,3000).map(x=>b.type==='mc'?{q:String(x.q).slice(0,2000),o:x.o.map(o=>String(o).slice(0,1000)),a:x.a}:{q:String(x.q).slice(0,2000),ans:String(x.ans||'').slice(0,5000)});
    const chunks=[]; const per=150; for(let i=0;i<qs.length;i+=per) chunks.push(qs.slice(i,i+per));
    for(let k=0;k<chunks.length;k++){ await this.db.doc(`bankdata/${id}/parts/p${k}`).set({qs:chunks[k],uid}); }
    await this.db.doc('banks/'+id).set({name:String(b.name).slice(0,120),type:b.type||'mc',format:b.format||'test',uni:String(b.uni).slice(0,60),uniLabel:String(b.uniLabel||'').slice(0,120),
      fac:String(b.fac||'').slice(0,120),subj:String(b.subj||'').slice(0,120),lang:b.lang||'az',count:qs.length,parts:chunks.length,uid,author:String(FB.user.displayName||'').slice(0,60),createdAt:Date.now()});
    store.set('sp_publim',{day:dayKey(),n:n+1});
    return id;
  },
  // раз в день тихо скачиваем все встроенные банки, чтобы service worker положил их в кэш — тесты работают без интернета
  async prefetch(){ try{ if(!navigator.onLine||!('serviceWorker' in navigator)||store.get('sp_pref','')===dayKey()) return;
    for(const m of this.staticMetas){ try{ await fetch('data/banks/'+m.id+'.json') }catch(e){} await new Promise(r=>setTimeout(r,150)) }
    store.set('sp_pref',dayKey()) }catch(e){} },
  async loadQs(meta){
    if(meta.src!=='user'){ const r=await fetch('data/banks/'+meta.id+'.json'); return r.ok?((await r.json()).qs||[]):[] }
    if(!this.db) throw 0;
    const out=[]; for(let k=0;k<Math.min(20,meta.parts||0);k++){const s=await this.db.doc(`bankdata/${meta.id}/parts/p${k}`).get(); if(s.exists&&Array.isArray(s.data().qs)) out.push(...s.data().qs)}
    // чужие данные: оставляем только корректные вопросы, чтобы битый документ не ломал тест
    return out.filter(x=>x&&typeof x.q==='string'&&x.q.trim()&&(meta.type==='written'?(x.ans==null||typeof x.ans==='string'):(Array.isArray(x.o)&&x.o.length>=2&&x.o.length<=12&&x.o.every(o=>typeof o==='string')&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length))).slice(0,3000);
  },
  async report(id,reason){ if(!this.db||!FB.user) return; await this.db.collection('reports').add({bank:id,reason:reason||'',uid:FB.user.uid,at:Date.now()}) },
  async remove(id){ await this.db.doc('banks/'+id).update({hidden:true}) }
};

const VIEWS=['home','catalog','tools','about','profile','rating','arena','duel','preview','bank','quiz','result','cards','ticket','game'];
function show(v){ if(v!=='duel'&&typeof DU!=='undefined'&&DU.unsub){ DU.unsub(); DU.unsub=null; DU.code=null }for(const s of VIEWS) $('v-'+s).classList.toggle('hide',s!==v);
  const nv={preview:'catalog',bank:'catalog',quiz:'catalog',result:'catalog',cards:'catalog',ticket:'catalog',game:'catalog',about:'profile',rating:'home',duel:'arena'}[v]||v;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.go===nv));
  window.scrollTo(0,0)}
function go(h){ if(location.hash==='#'+h) route(); else location.hash=h }
document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>go(a.dataset.go)); $('logo').onclick=()=>go('home');
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest('a[data-h]');if(a){e.preventDefault();go(a.dataset.h)}});
function route(){
  const h=location.hash.replace(/^#/,'')||'home'; let m;
  if(h==='home') return renderHome();
  if(h==='catalog') return renderCatalog({});
  if(h==='about') return renderAbout();
  if(h==='rating') return renderRating();
  if(h==='arena') return renderArena();
  if(m=h.match(/^duel-([A-Za-z0-9]{6})$/)) return renderDuel(m[1].toUpperCase());
  if(h==='mybanks') return renderTests('my');
  if(h==='upload') return renderTests('up');
  if(h==='profile') return renderProfile();
  if(/^(board|post)\b/.test(h)) return go('home');
  if(m=h.match(/^tools(?:-(calc|gpa|cal|pomo))?$/)) return renderTools(m&&m[1]);
  if(m=h.match(/^u-([a-z0-9-]+)$/)) return renderCatalog({uni:m[1]});
  if(m=h.match(/^f-([a-z0-9-]+?)--([a-z0-9-]+)$/)) return renderCatalog({uni:m[1],fac:m[2]});
  if(m=h.match(/^s-([a-z0-9-]+?)--([a-z0-9-]+?)--([a-z0-9-]+)$/)) return renderCatalog({uni:m[1],fac:m[2],subj:m[3]});
  if(m=h.match(/^b-([a-z0-9]+)$/)) return openShared(m[1]);
  renderHome();
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function pdfText(buf){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf}).promise; let out=[];
  for(let p=1;p<=doc.numPages;p++){
    $('status').textContent=t('reading_pdf',p,doc.numPages);
    const tc=await (await doc.getPage(p)).getTextContent();
    let lines=[],cur='',lastY=null;
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(lastY!==null && Math.abs(y-lastY)>2){lines.push(cur);cur=''}
      cur+=(cur&&!cur.endsWith(' ')&&!it.str.startsWith(' ')?' ':'')+it.str; lastY=y;
      if(it.hasEOL){lines.push(cur);cur='';lastY=null}
    }
    if(cur)lines.push(cur); out.push(...lines);
  }
  return {text:out.join('\n'),pages:doc.numPages};
}
async function docxText(buf){
  if(!window.mammoth){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');}
  const text=(await mammoth.extractRawText({arrayBuffer:buf})).value;
  let rich='';   // для ИИ: жирный шрифт (часто так отмечают правильный ответ) → **текст**
  try{ const h=(await mammoth.convertToHtml({arrayBuffer:buf})).value;
    rich=h.replace(/<(strong|b)>/g,'**').replace(/<\/(strong|b)>/g,'**').replace(/<u>/g,'__').replace(/<\/u>/g,'__').replace(/<\/(p|li|h\d|tr)>/g,'\n').replace(/<\/t[dh]>/g,' | ').replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'')
      .replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\*\*\s*\*\*/g,'') }catch(e){}
  return {text,rich};
}
let pending=null;
async function handleFiles(files){
  files=[...files]; if(!files.length) return;
  if(files.some(f=>f.size>30e6)){ $('status').textContent=t('file_big'); return }
  if(files.length>20){ $('status').textContent=t('files_many'); return }
  const imgs=files.filter(f=>/^image\//.test(f.type));
  if(imgs.length&&imgs.length===files.length) return aiFromSource({images:imgs,fname:imgs.length>1?t('photos_n',imgs.length):imgs[0].name});
  return handleFile(files.find(f=>!/^image\//.test(f.type))||files[0]);
}
async function handleFile(f){
  $('status').textContent=t('reading');
  try{
    const buf=await f.arrayBuffer(); let text='', pages=0, rich='';
    if(/\.pdf$/i.test(f.name)){ const r=await pdfText(buf); text=r.text; pages=r.pages }
    else if(/\.docx$/i.test(f.name)){ const r=await docxText(buf); text=r.text; rich=r.rich }
    else if(/^image\//.test(f.type)) return aiFromSource({images:[f],fname:f.name});
    else text=new TextDecoder().decode(buf);
    handleText(text,f.name,{file:f,pages,rich});
  }catch(e){$('status').textContent=t('read_fail')}
}
function guessLang(qs){const s=qs.slice(0,20).map(x=>x.q).join(' ');const cyr=(s.match(/[а-яё]/gi)||[]).length,az=(s.match(/[əğışçöü]/gi)||[]).length,lat=(s.match(/[a-z]/gi)||[]).length;return cyr>lat?'ru':(az>0?'az':'en')}
function bankName(text,fname){
  const fenn=(String(text).match(/F[əә]nn\s*:\s*([^\n]+)/i)||[])[1] || (String(text).match(/[“"«]([^”"»]{3,60})[”"»]\s*f[əә]nnind[əә]n/i)||[])[1];
  return (fenn||String(fname||'').replace(/\.(pdf|docx|txt|jpe?g|png|webp|heic)$/i,'')).replace(/^\s*\d+[a-zA-Z]?\s*/,'').trim().slice(0,80);
}
function handleText(text,fname,src){
  text=text||''; const mc=parseBank(text), list=parseQuestionList(text);
  const rich=src&&src.rich&&/\*\*/.test(src.rich)?src.rich:'';
  const source={text:rich||text,fname,file:src&&src.file,pages:src&&src.pages};
  const optLines=(text.match(/^\s*[A-Ea-eА-Да-д][\)\.]\s*\S/gm)||[]).length;
  // обычный разбор не нашёл отмеченных ответов, но в файле явно есть варианты/структура — отдаём ИИ
  if(mc.length<1 && (list.length<3 || optLines>=6)){ return aiFromSource(source,true) }
  openPending({mc,list,name:bankName(text,fname),fname,source});
}

  try{

}

async function aiRun(kind){

  const bar=$('aiBar'), box=$('aiBarBox'), msg=$('aiMsg'); box.classList.remove('hide'); bar.style.width='6%';
  $('aiBtns').querySelectorAll('button').forEach(b=>b.disabled=true); $('pvSave').disabled=true;
  const prog=(d,n)=>bar.style.width=Math.max(6,Math.round(d/n*100))+'%', lang=$('pvLang').value;
  try{
    if(kind==='reparse'){ msg.textContent='🤖 '+t('ai_reading'); const r=await aiExtract(P.source,prog); P.mc=r.mc; P.list=r.list; P.ai=true; P.page=0;
      P.type=r.mc.length>=r.list.length?'mc':'open'; msg.textContent=t('ai_done_extract',r.mc.length+r.list.length) }
    if(kind==='solve'){ msg.textContent='🤖 '+t('ai_working'); const n=await aiSolve(P.mc,prog); msg.textContent=t('ai_done_solve',n) }
    if(kind==='answers'){ msg.textContent='🤖 '+t('ai_working'); const n=await aiAnswers(P.list,lang,prog); msg.textContent=t('ai_done_answers',n) }
    if(kind==='options'){ msg.textContent='🤖 '+t('ai_working'); const mc=await aiOptions(P.list,lang,prog); P.mc=mc; P.type='mc'; P.page=0; msg.textContent=t('ai_done_options',mc.filter(x=>x.a>=0).length) }
    bar.style.width='100%';
  }catch(e){ msg.textContent=aiErrText(e) }
  P.busy=false; $('pvSave').disabled=false; setTimeout(()=>box.classList.add('hide'),800); renderPreview();
}

function pvClean(){
  const isMc=pending.type==='mc';
  if(isMc){ const all=pending.mc.map(x=>{ const o=[],map={}; x.o.forEach((s,j)=>{ s=String(s).trim(); if(s){ map[j]=o.length; o.push(s) } }); return {q:String(x.q).trim(),o,a:x.a>=0&&map[x.a]!=null?map[x.a]:-1} }).filter(x=>x.q&&x.o.length>=2);
    return {qs:all.filter(x=>x.a>=0),skipped:all.filter(x=>x.a<0).length} }
  const qs=pending.list.map(x=>({q:String(x.q).trim(),ans:String(x.ans||'').trim()})).filter(x=>x.q); return {qs,skipped:0};
}
$('pvSave').onclick=async()=>{
  if(!pending) return;
  const uniSel=$('pvUni').value, uniOther=$('pvUniOther').value.trim();

  if(!qs.length){ $('pvMsg').textContent=isMc&&skipped?t('pv_need_ok'):t('pv_empty'); return }
  if(skipped&&!pending.warn){ pending.warn=true; $('pvMsg').textContent=t('pv_skip_warn',skipped); return }
  const old=pending.editId&&mem.banks.find(x=>x.id===pending.editId);
  const b={id:old?old.id:'b'+Date.now(),name:$('pvName').value.trim()||pending.name||t('my_test'),type:isMc?'mc':'written',format:isMc?'test':pending.fmt,qs,
    uni:uniSel==='other'?slug(uniOther):uniSel, uniLabel:uniSel==='other'?uniOther:uniName(uniSel),
    fac:$('pvFac').value.trim(), subj:$('pvSubj').value.trim()||$('pvName').value.trim(), lang:$('pvLang').value};
  if(old){ if(old.sharedId) b.sharedId=old.sharedId; Object.keys(old).forEach(k=>delete old[k]); Object.assign(old,b); if(mem.stats[b.id]) delete mem.stats[b.id]; saveStats(); }
  else mem.banks.unshift(b);
  saveBanks(); if(!old){ award(Math.min(30,5+Math.floor(qs.length/10))); statInc('up') }
  if($('pvPublic').checked){
    if(!b.uni||!b.subj){$('pvMsg').textContent=t('need_uni_subj'); if(!old){mem.banks.shift();saveBanks()} return}
    $('pvSave').disabled=true; $('pvMsg').textContent=t('publishing');
    try{ const id=await Cat.publish(b); b.sharedId=id; saveBanks(); toast('🌍 '+t('pub_ok')) }
    catch(e){ $('pvSave').disabled=false; pending=null; openBank(b.id); $('bkMsg').textContent=e&&e.code==='quota_exceeded'?t('pub_quota'):t('pub_fail'); return }
    $('pvSave').disabled=false;
  }
  pending=null; openBank(b.id);
};

// ---------- quiz ----------
let Q=null,tick=null;
function startQuiz(mode,ids,minPerQ=0){
  ids=ids.filter(i=>i<curBank.qs.length); if(!ids.length)return;
  Q={mode,ids,i:0,answers:[],start:Date.now(),minPerQ,limit:minPerQ?Math.round(ids.length*minPerQ*60):0};
  clearInterval(tick); if(Q.limit){tick=setInterval(updTimer,500)} updTimer();
  show('quiz'); renderQ();
}
function updTimer(){
  if(!Q||!Q.limit){$('qzTimer').textContent='';return}
  const left=Math.max(0,Q.limit-Math.floor((Date.now()-Q.start)/1000));
  $('qzTimer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  $('qzTimer').style.color=left<60?'var(--bad)':'';
  if(left===0)finish();
}
function renderQ(){ try{ window.speechSynthesis&&speechSynthesis.cancel() }catch(e){}
  const x=curBank.qs[Q.ids[Q.i]];
  Q.order=shuffle(x.o.map((_,j)=>j)); Q.picked=null;
  $('qzPos').textContent=`${Q.i+1} / ${Q.ids.length} · `+(Q.mode==='exam'?t('exam_l'):t('practice_l'));
  $('qzBar').style.width=(Q.i/Q.ids.length*100)+'%';
  $('qzQ').textContent=x.q;
  $('qzOpts').innerHTML=Q.order.map((j,k)=>`<button class="opt" data-j="${j}"><span class="k">${k+1}</span><span>${esc(x.o[j])}</span></button>`).join('');
  $('qzOpts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  $('qzNext').disabled=true; $('qzNext').textContent=Q.i===Q.ids.length-1?t('finish'):t('next'); drawFavBtn();
}
function pick(j){
  const x=curBank.qs[Q.ids[Q.i]];
  if(Q.mode==='practice'&&Q.picked!==null)return;
  Q.picked=j;
  $('qzOpts').querySelectorAll('.opt').forEach(b=>{const bj=+b.dataset.j;b.classList.remove('sel');
    if(Q.mode==='practice'){b.disabled=true;if(bj===x.a)b.classList.add('ok');else if(bj===j)b.classList.add('bad')}
    else if(bj===j)b.classList.add('sel')});
  $('qzNext').disabled=false;
}
function next(){ if(Q.picked===null)return; Q.answers[Q.i]=Q.picked; bump(1); const okA=Q.picked===curBank.qs[Q.ids[Q.i]].a; if(okA) award(10); srsRecord(Q.ids[Q.i],okA); if(Q.i<Q.ids.length-1){Q.i++;renderQ()}else finish(); }
$('qzNext').onclick=next;
$('qzStop').onclick=()=>{if(Q.picked!==null){Q.answers[Q.i]=Q.picked;bump(1);const okA=Q.picked===curBank.qs[Q.ids[Q.i]].a;if(okA)award(10);srsRecord(Q.ids[Q.i],okA)}finish(true)};
if(!('speechSynthesis' in window)) $('qzTts').classList.add('hide'); $('qzTts').onclick=speakQ;
$('qzFav').onclick=()=>{ if(!Q||curBank.daily) return; toggleFav(curBank.id,Q.ids[Q.i]); drawFavBtn(); syncBkFav() };
document.addEventListener('keydown',e=>{
  if($('v-quiz').classList.contains('hide'))return;
  if(e.key==='Enter'){next();return}
  const n=+e.key; if(n>=1&&n<=Q.order.length)pick(Q.order[n-1]);
});
function finish(early){
  clearInterval(tick);
  if(early&&!Q.answers.length){ show(curBank&&curBank.id&&!curBank.daily&&!curBank.review?'bank':'home'); if(!curBank||curBank.daily||curBank.review) renderHome(); return }
  const done=Q.answers.length; let ok=0; const wrongIdx=[];
  Q.ids.forEach((qi,k)=>{ if(k>=done)return; const x=curBank.qs[qi]; if(Q.answers[k]===x.a)ok++; else wrongIdx.push(k)}); if(done){ statInc('q').then(()=>statInc('a',done)) }
  const total=early?Math.max(done,1):Q.ids.length;
  const pct=Math.round(ok/total*100);
  const st=mem.stats[curBank.id]||{wrong:[]};
  const wrongSet=new Set(st.wrong||[]);
  Q.ids.forEach((qi,k)=>{if(k>=done)return; if(Q.answers[k]===curBank.qs[qi].a)wrongSet.delete(qi);else wrongSet.add(qi)});
  st.wrong=[...wrongSet]; if(Q.mode==='exam'&&!early) st.best=Math.max(st.best||0,pct);
  if(curBank.daily) dailyFinished(ok,total); else if(!curBank.review){ mem.stats[curBank.id]=st; saveStats(); }
  const secs=Math.round((Date.now()-Q.start)/1000);
  $('rsScore').textContent=pct+'%';
  $('rsDetail').textContent=t('rs_detail',ok,total,Math.floor(secs/60),secs%60)+(Q.mode==='exam'&&!early?' · '+t('rs_scale',Math.round(ok/total*50),Math.round(ok/total*50)>=17?t('rs_pass'):t('rs_fail')):'');
  $('rsList').innerHTML=wrongIdx.map(k=>{const x=curBank.qs[Q.ids[k]];return `<div class="mistake"><b>${esc(x.q)}</b><div class="note"><span class="y">${t('your_ans')}: ${esc(x.o[Q.answers[k]]??'—')}</span><br><span class="c">${t('correct')}: ${esc(x.o[x.a])}</span></div></div>`}).join('');
  $('rsListCard').classList.toggle('hide',!wrongIdx.length);
  $('rsMist').disabled=!st.wrong.length;
  show('result');
}

function rateCard(knew){

  if(C.i<C.ids.length-1){C.i++;renderCard()} else endCards();

function endCards(){ C.done=true; $('cdBody').classList.add('hide'); $('cdDone').classList.remove('hide'); $('cdBar').style.width='100%';
  $('cdScore').textContent=t('cards_done',C.known,C.ids.length); $('cdAgainUnk').disabled=!C.unknown.length; }

// ---------- activity / streak ----------
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getAct(){const a=store.get('sp_act',null);return a&&a.days?a:{days:{},total:0}}
function bump(n){ if(!(n>0)) return; const a=getAct(), k=dayKey(); a.days[k]=(a.days[k]||0)+n; a.total=(a.total||0)+n;
  const ks=Object.keys(a.days).sort(); if(ks.length>400) ks.slice(0,ks.length-400).forEach(x=>delete a.days[x]); store.set('sp_act',a) }
function streak(){ const a=getAct(); const d=new Date(); let n=0; if(!a.days[dayKey(d)]) d.setDate(d.getDate()-1);
  while(a.days[dayKey(d)]){ n++; d.setDate(d.getDate()-1) } return n }

// ---------- exams calendar helpers ----------
function exams(){ return store.get('sp_exams',[]) }
function daysTo(ds){ const [y,m,d]=ds.split('-').map(Number); const a=new Date(y,m-1,d), b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/86400000) }
function leftLabel(n){ return n<0?t('passed'):n===0?t('today_exam'):n===1?t('tomorrow'):t('days_left',n) }
function nextExam(){ return exams().map(e=>({...e,n:daysTo(e.d)})).filter(e=>e.n>=0).sort((a,b)=>a.n-b.n)[0] }
const MON={az:['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'],ru:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],en:['January','February','March','April','May','June','July','August','September','October','November','December']};
const WD={az:['B.','B.e.','Ç.a.','Ç.','C.a.','C.','Ş.'],ru:['вс','пн','вт','ср','чт','пт','сб'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
function fmtDate(ds){ const [y,m,d]=ds.split('-').map(Number); const dt=new Date(y,m-1,d); const L=MON[LANG]?LANG:'az';
  return `${d} ${MON[L][m-1]}${y!==new Date().getFullYear()?' '+y:''}, ${WD[L][dt.getDay()]}` }

function renderProgress(){
  const a=getAct(), s=streak(), today=a.days[dayKey()]||0, ne=nextExam();
  $('prStreak').textContent=s+(s?' 🔥':''); $('prToday').textContent=today; $('prTotal').textContent=a.total||0;

}

// score calculator (50 semester + 50 exam, exam >= 17)
const GRADES=[['A',91],['B',81],['C',71],['D',61],['E',51]];
const GCOL={A:'#16a34a',B:'#65a30d',C:'#ca8a04',D:'#ea580c',E:'#f97316',F:'#dc2626'};
function letter(total){ for(const [g,m] of GRADES) if(total>=m) return g; return 'F' }
function gb(g){ return `<span class="gb" style="background:${GCOL[g]}">${g}</span>` }
function numVal(v,max){ const x=parseFloat(String(v).replace(',','.')); return isNaN(x)?null:Math.min(max,Math.max(0,x)) }
function renderCalc(){
  const bad=v=>{ const x=parseFloat(String(v).replace(',','.')); return String(v).trim()!==''&&(isNaN(x)||x<0||x>50) };
  if(bad($('clSem').value)||bad($('clExam').value)){ $('clTable').innerHTML=`<div class="empty" style="color:var(--bad)">${t('calc_range')}</div>`; $('clFinal').innerHTML=''; return }
  const s=numVal($('clSem').value,50), e=numVal($('clExam').value,50);
  store.set('sp_calc',{s:$('clSem').value,e:$('clExam').value});
  $('clTable').innerHTML=s==null?`<div class="empty">${t('calc_empty')}</div>`:GRADES.map(([g,m])=>{
    const need=Math.max(17,Math.ceil(m-s)), imp=need>50;
    return `<div class="tile" style="cursor:default;margin-bottom:8px;${imp?'opacity:.55':''}"><span>${gb(g)} <span style="margin-left:6px">${t('g_'+g)}</span> <span class="note">${m}+</span></span><b style="${imp?'color:var(--bad)':''}">${imp?t('calc_imp'):t('calc_need',need)}</b></div>`}).join('');
  if(s==null||e==null){ $('clFinal').innerHTML=''; return }
  const tot=Math.round((s+e)*10)/10, g=e<17?'F':letter(tot);
  $('clFinal').innerHTML=`<div class="stat" style="text-align:center"><span class="note">${t('calc_total')}</span><b style="font-size:34px;margin:4px 0">${tot} ${gb(g)}</b><span class="note">${e<17?t('calc_fail_min'):t('g_'+g)}</span></div>`;
}

// GPA (ÜOMG) calculator
let GP=null;
function blankRow(){ return {n:'',c:'',s:''} }
function renderGpa(){
  if(!GP) GP=store.get('sp_gpa',null)||[blankRow(),blankRow(),blankRow()];
  $('gpRows').innerHTML=`<div class="gprow hd"><span>${t('gpa_subj')}</span><span>${t('gpa_cr')}</span><span>${t('gpa_score')}</span><span></span></div>`+
    GP.map((r,i)=>`<div class="gprow"><input type="text" data-r="${i}" data-k="n" value="${esc(r.n)}" placeholder="${esc(t('gpa_subj'))} ${i+1}"><input type="number" inputmode="decimal" data-r="${i}" data-k="c" value="${esc(r.c)}" placeholder="5"><input type="number" inputmode="decimal" data-r="${i}" data-k="s" value="${esc(r.s)}" placeholder="85"><button class="btn ghost small" data-del="${i}" aria-label="x">✕</button></div>`).join('');
  $('gpRows').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ GP[+inp.dataset.r][inp.dataset.k]=inp.value; store.set('sp_gpa',GP); gpaOut() });
  $('gpRows').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ GP.splice(+b.dataset.del,1); if(!GP.length) GP.push(blankRow()); store.set('sp_gpa',GP); renderGpa() });
  gpaOut();
}
function gpaOut(){
  let sum=0,cr=0,n=0; GP.forEach(r=>{ const c=numVal(r.c,100), s=numVal(r.s,100); if(c>0&&s!=null&&String(r.s).trim()!==''){ sum+=s*c; cr+=c; n++ } });
  if(!cr){ $('gpOut').innerHTML=''; return }
  const g=sum/cr;
  $('gpOut').innerHTML=`<div class="stat" style="text-align:center"><span class="note">${t('gpa_out')}</span><b style="font-size:34px;margin:4px 0">${g.toFixed(2)} ${gb(letter(g))}</b><span class="note">${t('gpa_meta',n,Math.round(cr*10)/10)}</span></div>`;
}

function beep(){ try{ const A=new (window.AudioContext||window.webkitAudioContext)();
  [0,.35,.7].forEach(d=>{ const o=A.createOscillator(), g=A.createGain(); o.frequency.value=880; o.connect(g); g.connect(A.destination);
    g.gain.setValueAtTime(.25,A.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d+.3); o.start(A.currentTime+d); o.stop(A.currentTime+d+.32) }) }catch(e){} }

function siteUrl(h){ return location.origin+location.pathname+(h?'#'+h:'') }
async function shareText(text,url){

  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
}

// ---------- search inside a bank ----------
const FOLD={ı:'i',ə:'e',ş:'s',ç:'c',ğ:'g',ö:'o',ü:'u',ё:'е'};
function lowq(s){ return String(s||'').replace(/[İI]/g,'i').toLowerCase().replace(/[ıəşçğöüё]/g,c=>FOLD[c]) }
function hl(s,q){ const i=lowq(s).indexOf(q); if(i<0||lowq(s).length!==s.length) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)) }
function renderSearch(){
  const q=lowq($('bkSearch').value.trim()), box=$('bkSearchRes');
  if(q.length<2||!curBank||!curBank.qs){ box.innerHTML=''; return }
  const W=curBank.type==='written', hits=[];
  curBank.qs.forEach((x,i)=>{ const a=W?getAns(curBank,i):x.o[x.a]; if(lowq(x.q).includes(q)||lowq(a).includes(q)) hits.push([x,a]) });
  box.innerHTML=hits.length?hits.slice(0,15).map(([x,a])=>`<div class="mistake"><b>${hl(x.q,q)}</b><div class="note c" style="margin-top:4px;white-space:pre-wrap">✓ ${a?hl(a,q):'—'}</div></div>`).join('')
    +(hits.length>15?`<div class="note" style="padding-top:8px">${t('search_more',hits.length-15)}</div>`:'')
    :`<div class="empty">${t('search_none')}</div>`;
}

// ---------- игровые механики: XP, уровни, недельный рейтинг, дневная цель, «10 вопросов дня», избранное ----------
function weekKey(d){ d=d||new Date(); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7); return y+'-W'+String(w).padStart(2,'0') }
function getXP(){ const x=store.get('sp_xp',null)||{total:0,week:weekKey(),wk:0}; if(x.week!==weekKey()){ x.week=weekKey(); x.wk=0 } return x }
function levelOf(total){ const L=Math.floor(Math.sqrt((total||0)/50))+1; return {L,from:(L-1)*(L-1)*50,to:L*L*50} }
let lbTimer=null, lbRetry=0;
function award(n){ if(!(n>0)) return; const x=getXP(); x.total+=n; x.wk+=n; store.set('sp_xp',x); clearTimeout(lbTimer); lbTimer=setTimeout(()=>{lbPush();checkBadges()},1500) }
function lbName(u){ return String((u&&u.displayName)||t('student')+' '+String(u&&u.uid||'').slice(0,4)).slice(0,40) }
async function lbPush(){
  const u=FB.user; if(!isReal(u)) return; await catDb(); if(!Cat.db) return; const x=getXP(); if(!x.wk) return;
  try{ await Cat.db.collection('lb').doc(x.week).collection('users').doc(u.uid).set({name:lbName(u),wk:x.wk,at:Date.now()}); lbRetry=0 }catch(e){ console.warn('lb',e); if(lbRetry++<3){ clearTimeout(lbTimer); lbTimer=setTimeout(lbPush,12000) } }
}
async function catDb(){ await fbStart(); if(!Cat.db&&window.firebase&&firebase.apps&&firebase.apps.length){ try{ Cat.db=firebase.firestore() }catch(e){} } return Cat.db }
function getGoal(){ return store.get('sp_goal',20) }
function todayCount(){ return getAct().days[dayKey()]||0 }

// ---------- «10 вопросов дня»: одинаковые для всех в этот день ----------
function seeded(seed){ let h=2166136261; for(const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619) } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1e6)/1e6 } }
const bankCache={};
async function startDaily(){
  const btn=$('hmDaily'); if(btn){ btn.disabled=true; btn.textContent=t('loading') }
  try{
    let src=Cat.staticMetas.filter(m=>m.type==='mc'&&m.lang===(LANG==='ru'?'ru':'az')); if(src.length<3) src=Cat.staticMetas.filter(m=>m.type==='mc');
    const rnd=seeded(dayKey()+'|'+LANG); const pool=[];
    for(const m of src){ if(!bankCache[m.id]) bankCache[m.id]=await Cat.loadQs(m); bankCache[m.id].forEach(q=>pool.push(q)) }
    const qs=[]; const used=new Set(); while(qs.length<10&&used.size<pool.length){ const i=Math.floor(rnd()*pool.length); if(!used.has(i)){ used.add(i); qs.push(pool[i]) } }
    curBank={id:'daily',name:t('daily_title'),type:'mc',qs,daily:true}; startQuiz('practice',qs.map((_,i)=>i));
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent=t('load_fail') } }
}

function planBanks(){ const seen=new Set(), L=[];
  mem.banks.filter(b=>b.type!=='written'&&b.qs&&b.qs.length).forEach(b=>{ if(!seen.has(b.id)){ seen.add(b.id); L.push({id:b.id,name:b.name,n:b.qs.length}) } });
  Cat.metas.filter(m=>(m.type||'mc')==='mc'&&m.count).forEach(m=>{ if(!seen.has(m.id)){ seen.add(m.id); L.push({id:m.id,name:m.name,n:m.count}) } });
  return L }
function bankLearned(id){ const S=store.get('sp_srs',{}), p=id+'|'; let k=0; for(const x in S) if(x.startsWith(p)&&S[x].n>0) k++; return k }
function planToday(id){ const P=store.get('sp_plan',{}); return P.day===dayKey()?(P[id]||0):0 }
function planBump(id){ const d=dayKey(); let P=store.get('sp_plan',{}); if(P.day!==d) P={day:d}; P[id]=(P[id]||0)+1; store.set('sp_plan',P) }
function examPlan(){
  const e=exams().map(e=>({...e,n:daysTo(e.d)})).filter(e=>e.n>=0&&e.b).sort((a,b)=>a.n-b.n)[0]; if(!e) return null;
  const bk=planBanks().find(x=>x.id===e.b), total=(bk&&bk.n)||e.bc||0; if(!total) return null;
  const learned=Math.min(total,bankLearned(e.b)), done=planToday(e.b), left=total-learned;
  const per=left?Math.max(5,Math.ceil((left+done)/Math.max(1,e.n))):0;
  return {...e,total,learned,left,done,per} }

    <button class="btn" id="hmPlan" style="margin-top:12px">${p.left?(p.done>=p.per?t('plan_more'):t('plan_go')):t('plan_repeat')}</button></div>` }

// ---------- игры по банку: «Uyğunlaşdır» (6 пар на время) и «Doğru / Yanlış» (блиц 60 секунд) ----------
function gmPairs(b){ const W=b&&b.type==='written', out=[];
  ((b&&b.qs)||[]).forEach((x,i)=>{ const a=W?getAns(b,i):(Array.isArray(x.o)&&x.a>=0?x.o[x.a]:''); if(x.q&&a&&String(a).trim()) out.push({i,q:String(x.q),a:String(a)}) });
  // одинаковые ответы нельзя ставить в одну игру — пары станут неоднозначными
  const seen=new Set(); return out.filter(p=>{ const k=p.a.trim().toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true }) }
function gmRec(){ return store.get('sp_games',{}) }
function gmSetRec(k,v){ const R=gmRec(); R[k]=v; store.set('sp_games',R) }
function fmtMs(ms){ const s=ms/1000; return s<60?s.toFixed(1)+' s':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') }
function drawGameRec(){ const b=curBank, box=$('bkGames'); if(!box) return; if(!b||!b.qs){ box.classList.add('hide'); return }

  box.classList.toggle('hide',P.length<4&&tfN<4); $('bkMatch').classList.toggle('hide',P.length<4); $('bkTF').classList.toggle('hide',tfN<4);
  const m=R['m|'+b.id], tf=R['t|'+b.id];
  $('bkGameRec').textContent=[m?'🧩 '+t('gm_best',fmtMs(m)):'', tf?'⚡ '+t('gm_best',tf):''].filter(Boolean).join(' · ') }
function gmStop(){ if(MG){ clearInterval(MG.iv); MG.over=true } if(TF){ clearInterval(TF.iv); TF.over=true } }

let MG=null;
function startMatch(){ gmStop(); const P=gmPairs(curBank); if(P.length<4) return toast(t('gm_few'));
  let pool=P.filter(p=>p.q.length<=160&&p.a.length<=90); if(pool.length<6) pool=P;

  MG={pairs:pick,left:shuffle([...Array(n).keys()]),right:shuffle([...Array(n).keys()]),sel:null,done:0,miss:0,start:Date.now(),iv:null,over:false};
  show('game'); renderMatch();
  MG.iv=setInterval(()=>{ if(!MG||MG.over) return; if($('v-game').classList.contains('hide')) return gmStop(); const el=$('mgTime'); if(el) el.textContent=fmtMs(Date.now()-MG.start+MG.miss*1000) },100) }
function renderMatch(){ const box=$('gmBox');
  box.innerHTML=`<div class="gmtop"><b>🧩 ${t('match_name')}</b><span class="timer" id="mgTime">0.0 s</span><button class="btn ghost small" id="gmQuit" aria-label="✕">✕</button></div>

    <div class="mcol">${MG.right.map(k=>`<button class="mt a" data-s="a" data-k="${k}">${esc(MG.pairs[k].a)}</button>`).join('')}</div></div>`;
  $('gmQuit').onclick=gmQuit; box.querySelectorAll('.mt').forEach(b=>b.onclick=()=>matchTap(b)) }
function matchTap(b){ if(!MG||MG.over||b.classList.contains('ok')) return; const s=MG.sel;

  else { MG.miss++; [s,b].forEach(x=>{ x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); setTimeout(()=>x.classList.remove('bad'),400) }) } }
function matchEnd(){ const ms=Date.now()-MG.start+MG.miss*1000, k='m|'+curBank.id, best=gmRec()[k], rec=!best||ms<best; if(rec) gmSetRec(k,ms);
  bump(MG.pairs.length); award(15);
  gmResult('🧩',fmtMs(ms),(MG.miss?t('gm_miss',MG.miss)+' · ':'')+(rec?t('gm_new'):t('gm_best',fmtMs(best))),startMatch) }

// ---------- AI: Gemini через Firebase AI Logic (бесплатный тариф Spark, ключ не нужен) ----------
// Распознаёт структуру тестов из PDF/DOCX/фото, отмечает правильные ответы, пишет ответы к вопросам и делает варианты.
const AI_SDK='12.12.0';
const AI_MODELS=['gemini-3.5-flash-lite','gemini-3.6-flash','gemini-3.1-flash-lite'];
const AI_LIMIT={real:60,guest:15};             // запросов к ИИ в день на пользователя (админам без лимита)
const AI_APPCHECK_KEY='6LfjciouAAAAANhW9OWYhQLTRX1Ro9NGdSzxaLHc'; // reCAPTCHA v3 (сайт elmin-eyvazov.github.io)
const AI_APPCHECK_ON=false;                    // включить после того, как секретный ключ добавлен в Firebase → App Check
const AI_CHUNK=7000;                           // символов текста на один запрос
let _ai=null, _aiModel=0;
async function aiCore(){
  if(_ai) return _ai;
  const base='https://www.gstatic.com/firebasejs/'+AI_SDK+'/';
  const A=await import(base+'firebase-app.js'), M=await import(base+'firebase-ai.js');
  const app=A.getApps().find(a=>a.name==='ai')||A.initializeApp(FB_CONFIG,'ai');
  if(AI_APPCHECK_ON){ try{ const C=await import(base+'firebase-app-check.js'); C.initializeAppCheck(app,{provider:new C.ReCaptchaV3Provider(AI_APPCHECK_KEY),isTokenAutoRefreshEnabled:true}) }catch(e){} }
  _ai={M,ai:M.getAI(app,{backend:new M.GoogleAIBackend()})}; return _ai;
}
function aiUsage(){ const u=store.get('sp_ai',{}); return u.day===dayKey()?u.n:0 }
function aiLimit(){ return (typeof isAdmin==='function'&&isAdmin())?9999:(isReal(FB.user)?AI_LIMIT.real:AI_LIMIT.guest) }
function aiLeft(){ return Math.max(0,aiLimit()-aiUsage()) }
function aiSpend(n){ store.set('sp_ai',{day:dayKey(),n:aiUsage()+(n||1)}); if(typeof statInc==='function') statInc('ai',n||1) }
function aiErr(code){ const e=new Error(code); e.code=code; return e }
function jsonSalvage(s){
  try{ return JSON.parse(s) }catch(e){}
  let p=s.length;                                    // обрезанный ответ: отрезаем по последнему целому объекту и закрываем массив
  for(let k=0;k<300;k++){ p=s.lastIndexOf('}',p-1); if(p<0) return null; try{ return JSON.parse(s.slice(0,p+1)+']}') }catch(e){} }
  return null;
}
// один запрос к модели с перебором моделей при 404/429/перегрузке
async function aiCall(parts,schema,{temp=0}={}){
  if(aiLeft()<=0) throw aiErr('ai_limit');
  const {M,ai}=await aiCore(); let last=null;
  for(let k=0;k<AI_MODELS.length;k++){
    const name=AI_MODELS[(_aiModel+k)%AI_MODELS.length];
    try{
      const model=M.getGenerativeModel(ai,{model:name,generationConfig:{responseMimeType:'application/json',responseSchema:schema(M.Schema),temperature:temp}});
      const r=await model.generateContent(parts); aiSpend(1);
      const j=jsonSalvage(r.response.text()); if(!j) throw aiErr('ai_bad');
      _aiModel=(_aiModel+k)%AI_MODELS.length; return j;
    }catch(e){ last=e; const s=String(e&&e.message||e);
      if(e.code==='ai_bad'||/404|429|503|500|overloaded|not found|no longer|quota|RESOURCE_EXHAUSTED|UNAVAILABLE/i.test(s)) continue;
      throw e; }
  }
  if(last&&/429|quota|RESOURCE_EXHAUSTED/i.test(String(last.message))) throw aiErr('ai_busy');
  throw last||aiErr('ai_fail');
}
async function aiPool(jobs,n,onDone){ const out=new Array(jobs.length); let i=0,done=0;
  await Promise.all(Array.from({length:Math.min(n,jobs.length)},async()=>{ while(i<jobs.length){ const k=i++; out[k]=await jobs[k](); done++; onDone&&onDone(done,jobs.length) } }));
  return out }
function aiChunks(text,size){
  const lines=String(text).replace(/\r/g,'').split('\n'), out=[]; let cur='';
  for(const l of lines){
    const startsQ=/^\s*(\d{1,4}\s*[\.\)]|sual\s*\d|вопрос\s*\d|question\s*\d|#\s*\d)/i.test(l);
    if(cur.length>size&&startsQ || cur.length>size*1.6){ out.push(cur); cur='' }
    cur+=l+'\n';
  }
  if(cur.trim()) out.push(cur); return out;
}
// фото страниц уменьшаем до 2000 px (JPEG): быстрее отправка и меньше риск превысить лимит запроса
async function shrinkImg(f){ try{ if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.2e6) return f;
  const bm=await createImageBitmap(f), k=Math.min(1,2000/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k); c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f }catch(e){ return f } }
function b64(buf){ let s='',b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s) }

const AI_EXTRACT_RULES=`You convert a university exam question bank (Azerbaijan; Azerbaijani, Russian or English) into structured JSON.
The input may be messy: broken lines, page headers/footers, page numbers, titles, teacher names — ignore everything that is not a question.
Return EVERY question in the original order. Do not invent, merge, translate or summarize questions.
- q: the question text exactly as written; join broken line wraps; remove the leading number/label.
- o: the answer options WITHOUT their labels (A) a) 1. • - etc.) and WITHOUT correctness markers (√ * + » ** "(correct)" etc.); [] if the question has no options.
- a: 0-based index of the correct option. It can be marked by √ ✓ + * • » «))» ●, bold (**text**), underline, highlighting, "(düzgün)"/"(верно)", or given in an answer key ("1-B", "1) C", "Cavab: A", "Ответ: б", a table at the end). If nothing marks it use -1 — never guess.
- ans: for questions WITHOUT options — the answer/explanation if the document contains it, else "". For questions with options — "".
- m: how the document itself indicates the correct option of THIS question: "mark" (symbol, bold, underline, highlight), "key" (answer key / "Cavab:" line) or "none". If "none", a MUST be -1 even if you know the answer.`;
const aiQSchema=S=>S.object({properties:{questions:S.array({items:S.object({properties:{q:S.string(),o:S.array({items:S.string()}),a:S.integer(),ans:S.string(),m:S.enumString?S.enumString({enum:['mark','key','none']}):S.string()}})})}});
// в тексте нет ни одного признака правильного ответа → ИИ не должен «угадывать» (иначе догадки выглядят как ответы из файла)
const MARK_RE=/[√✓✔•»●◉☑]|\*\*|\(\(|\)\)|^\s*\d+\s*[-–.)]\s*[A-Ea-eА-Да-д]\s*[,;.]?\s*$|\b\d+\s*[-–]\s*[A-Ea-eА-Да-д]\b|cavab|düzgün|doğru|ответ|верн|правильн|answer|correct|\+\s*$/im;

// Распознать структуру: из текста (кусками) или из самого файла (PDF/фото — модель видит жирный шрифт и разметку)
async function aiExtract(src,onProgress){
  let res=[];
  if(src.images&&src.images.length){                 // несколько фото страниц: по 4 фото на запрос
    const groups=[]; for(let i=0;i<src.images.length;i+=4) groups.push(src.images.slice(i,i+4));
    if(groups.length>aiLeft()) throw aiErr('ai_limit');
    const outs=await aiPool(groups.map(g=>async()=>aiCall([{text:AI_EXTRACT_RULES+'\n\nThe pages are attached as photos, in order.'},...await Promise.all(g.map(async im0=>{ const im=await shrinkImg(im0); return {inlineData:{mimeType:im.type||'image/jpeg',data:b64(await im.arrayBuffer())}} }))],aiQSchema)),2,onProgress);
    for(const j of outs) res.push(...((j&&j.questions)||[]));
    return aiSplit(res);
  }
  const f=src.file, isPdf=f&&/\.pdf$/i.test(f.name), isImg=f&&/^image\//.test(f.type);
  const scanned=isPdf&&(src.text||'').trim().length<Math.max(300,(src.pages||1)*80);
  const useFile=isImg||isPdf&&f.size<18e6&&(scanned||(src.pages||99)<=12);
  if(useFile){
    onProgress&&onProgress(0,1);
    const ff=isImg?await shrinkImg(f):f, mime=isPdf?'application/pdf':(ff.type||'image/jpeg');
    const j=await aiCall([{text:AI_EXTRACT_RULES+'\n\nThe document is attached.'},{inlineData:{mimeType:mime,data:b64(await ff.arrayBuffer())}}],aiQSchema);
    res=(j&&j.questions)||[]; onProgress&&onProgress(1,1);
  }else{
    const parts=aiChunks(src.text||'',AI_CHUNK).slice(0,40);
    if(!parts.length) throw aiErr('ai_empty');
    if(parts.length>aiLeft()) throw aiErr('ai_limit');
    const outs=await aiPool(parts.map(p=>()=>aiCall(AI_EXTRACT_RULES+'\n\nTEXT:\n'+p,aiQSchema).catch(e=>{ if(e.code==='ai_limit') throw e; return {questions:[]} })),3,onProgress);
    for(const j of outs) res.push(...((j&&j.questions)||[]));
  }
  return aiSplit(res,!useFile&&!MARK_RE.test(src.text||''));
}
function aiSplit(res,noMarks){
  const mc=[],list=[],seen=new Set();
  for(const x of res){
    const q=String(x.q||'').trim(); if(!q) continue;
    const o=(x.o||[]).map(s=>String(s).trim()).filter(Boolean);
    const key=q.toLowerCase()+'|'+o.join('|').toLowerCase(); if(seen.has(key)) continue; seen.add(key);

}

// Отметить правильные ответы в тестах, где они не отмечены
async function aiSolve(items,onProgress){
  const idx=items.map((x,i)=>i).filter(i=>!(items[i].a>=0)); const batches=[]; for(let i=0;i<idx.length;i+=25) batches.push(idx.slice(i,i+25));
  if(batches.length>aiLeft()) throw aiErr('ai_limit');
  const sch=S=>S.object({properties:{answers:S.array({items:S.object({properties:{i:S.integer(),a:S.integer()}})})}});
  let n=0;
  await aiPool(batches.map(b=>async()=>{
    const body=b.map(i=>({i,q:items[i].q,o:items[i].o}));
    const j=await aiCall(`You are an expert university lecturer. For each multiple-choice question choose the correct option. Return i (as given) and a = 0-based index of the correct option.\n\n`+JSON.stringify(body),sch);
    for(const r of (j.answers||[])){ const it=items[r.i]; if(it&&b.includes(r.i)&&r.a>=0&&r.a<it.o.length){ it.a=r.a; it.ai=1; n++ } }
  }),3,onProgress);
  return n;
}

  if(batches.length>aiLeft()) throw aiErr('ai_limit');
  const sch=S=>S.object({properties:{answers:S.array({items:S.object({properties:{i:S.integer(),ans:S.string()}})})}});

Each answer: 3–7 sentences, accurate, with the key definition, main points and terms (formula or example if relevant). Plain text, no markdown, no "Answer:" prefix. Return i as given.\n\n`+JSON.stringify(body),sch,{temp:0.3});

// Превратить открытые вопросы в тест с 4 вариантами
async function aiOptions(list,lang,onProgress){
  const batches=[]; for(let i=0;i<list.length;i+=15) batches.push(list.slice(i,i+15).map((x,k)=>i+k));
  if(batches.length>aiLeft()) throw aiErr('ai_limit');
  const sch=S=>S.object({properties:{items:S.array({items:S.object({properties:{i:S.integer(),q:S.string(),o:S.array({items:S.string()}),a:S.integer()}})})}});
  const out=new Array(list.length);
  await aiPool(batches.map(b=>async()=>{
    const body=b.map(i=>({i,q:list[i].q,ref:list[i].ans||undefined}));
    const j=await aiCall(`Turn each exam question into a multiple-choice test question in ${LANG_NAME[lang]||'the language of the question'}.

    for(const r of (j.items||[])){ const o=(r.o||[]).map(s=>String(s).trim()).filter(Boolean); if(b.includes(r.i)&&o.length>=2&&r.a>=0&&r.a<o.length) out[r.i]={q:String(r.q||list[r.i].q).trim(),o,a:r.a,ai:1} }
  }),3,onProgress);
  return out.map((x,i)=>x||{q:list[i].q,o:['','','',''],a:-1});
}
