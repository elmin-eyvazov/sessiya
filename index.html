.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}

<script>
// Test-bank text parser. Input: plain text (lines). Output: [{q, o:[...], a}]
function normLine(s){
  return s.replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/ә/g,'ə').replace(/Ә/g,'Ə').trim();
}
const QNUM=/^(\d{1,4})\s*[.)]\s*(?:Sual\s*:\s*)?(.*)$/i;
const MARK_OPT=/^([•●▪◦\-–√✓✔+])\s*(.*)$/;          // "• text" / "√ text"
const LETTER_OPT=/^([A-EА-Е])\s*(\)\)|\)|\.)\s*(.*)$/; // "A) text" / "C)) text"
const CORRECT_MARK=/[√✓✔+]/;

function parseBank(text){
  const raw=text.split(/\r?\n/).map(normLine).filter(l=>l.length);
  // drop page furniture
  const pre=raw.filter(l=>!/^\d{1,2}[./]\d{1,2}[./]\d{2,4}$/.test(l) && !/^\d+\/\d+$/.test(l));
  // drop runs (>=3) of consecutive integers (row-number columns from PDF tables)
  const drop=new Set();
  for(let i=0;i<pre.length;){
    let j=i; while(j+1<pre.length && /^\d{1,4}$/.test(pre[j]) && /^\d{1,4}$/.test(pre[j+1]) && +pre[j+1]===+pre[j]+1) j++;
    if(j-i>=2){ for(let k=i;k<=j;k++) drop.add(k); i=j+1; } else i++;
  }
  const lines=pre.filter((_,k)=>!drop.has(k));
  let out=[];
  out=parseMarked(lines); if(out.length>=3) return dedupe(out);
  out=parseLetter(lines); if(out.length>=3) return dedupe(out);
  out=parseTrailingBullet(lines);
  return dedupe(out);
}

// Format 1: "12. Question" + option lines starting with • (wrong) or √ (correct)
function parseMarked(lines){
  const res=[]; let cur=null;
  const flush=()=>{ if(cur && cur.o.length>=2 && cur.a>=0) res.push(cur); cur=null; };
  for(const l of lines){
    let m=l.match(MARK_OPT);
    if(m && cur){
      const isC=CORRECT_MARK.test(m[1]);
      if(m[2]==='' ){ cur.pending=isC; continue; }
      if(isC||cur.pending){ cur.a=cur.o.length; cur.pending=false; }
      cur.o.push(m[2]); cur.lastOpt=true; continue;
    }
    if(m && !cur) continue;
    const q=l.match(QNUM);
    if(q && q[2]){ flush(); cur={q:q[2],o:[],a:-1}; continue; }
    if(cur){
      if(cur.o.length===0) cur.q+=' '+l;            // question continues
      else if(cur.pending!==undefined && cur.o.length) cur.o[cur.o.length-1]+=' '+l; // option continues
    }
  }
  flush(); return res.map(clean);
}

// Format 2: "1) Sual: text" + "A) ..." options; correct marked as "C))" or option starting with + / √
function parseLetter(lines){
  const res=[]; let cur=null;
  const flush=()=>{ if(cur && cur.o.length>=2 && cur.a>=0) res.push(cur); cur=null; };
  for(const l of lines){
    const q=l.match(QNUM);
    const lo=l.match(LETTER_OPT);
    if(lo && cur && !(q && !lo)){
      let t=lo[3]; let isC=lo[2]==='))';
      if(/^[√✓✔+]\s*/.test(t)){ isC=true; t=t.replace(/^[√✓✔+]\s*/,''); }
      if(/\s*[•√✓✔]$/.test(t)){ isC=true; t=t.replace(/\s*[•√✓✔]$/,''); }
      if(isC) cur.a=cur.o.length;
      cur.o.push(t); continue;
    }
    if(q && q[2]){ flush(); cur={q:q[2],o:[],a:-1}; continue; }
    if(cur){ if(cur.o.length===0) cur.q+=' '+l; else cur.o[cur.o.length-1]+=' '+l; }
  }
  flush(); return res.map(clean);
}

// Format 3: question line(s) followed by option lines, exactly one ends with "•"
function isQ(l){ return /[?:]$/.test(l) || /^Sual\s*:/i.test(l); }
function parseTrailingBullet(lines){
  const res=[]; let i=0; let qbuf=[];
  const hasQ=lines.filter(isQ).length>=3;
  if(hasQ){
    while(i<lines.length){
      if(isQ(lines[i])){
        const q=lines[i].replace(QNUM,'$2'); const o=[]; let j=i+1;
        while(j<lines.length && !isQ(lines[j]) && o.length<8){ o.push(lines[j]); j++; }
        const marked=o.filter(x=>/•$/.test(x));
        // drop leading continuation lines of the question (question may wrap): keep last 6 options max
        if(marked.length===1 && o.length>=2){
          const opts=o.slice(-Math.min(o.length,6));
          const a=opts.findIndex(x=>/•$/.test(x));
          if(a>=0) res.push(clean({q, o:opts.map(x=>x.replace(/\s*•$/,'')), a}));
        }
        i=j; continue;
      }
      i++;
    }
    return res;
  }
  while(i<lines.length){
    let best=null;
    for(const k of [5,4,3,6]){
      const grp=lines.slice(i,i+k); if(grp.length<k) continue;
      if(grp.filter(x=>/•$/.test(x)).length===1 && !grp.some(isQ) && grp.every(x=>x.length<=160)){ best=grp; break; }
    }
    if(best && qbuf.length){
      res.push(clean({q:qbuf.join(' ').replace(QNUM,'$2'),o:best.map(x=>x.replace(/\s*•$/,'')),a:best.findIndex(x=>/•$/.test(x))}));
      qbuf=[]; i+=best.length; continue;
    }
    qbuf.push(lines[i]); if(qbuf.length>3) qbuf.shift(); i++;
  }
  return res;
}

function clean(x){
  return {q:x.q.replace(/\s+/g,' ').trim(), o:x.o.map(s=>s.replace(/\s+/g,' ').trim()), a:x.a};
}
function dedupe(arr){
  const seen=new Set(); return arr.filter(x=>{const k=x.q+'|'+x.o.join('|'); if(seen.has(k)) return false; seen.add(k); return x.q.length>2;});
}
if(typeof module!=='undefined') module.exports={parseBank};

const READY_SETS=[
{id:"inf",name:"İnformatika (əsaslar)",tag:"Hazır test",qs:[
{q:"1 bayt neçə bitdən ibarətdir?",o:["4","8","16","2","10"],a:1},

{q:"Hansı qurğu giriş qurğusudur?",o:["Monitor","Printer","Klaviatura","Dinamik","Proyektor"],a:2},

{q:"Hansı proqram əməliyyat sistemidir?",o:["MS Word","Windows","MS Excel","Google Chrome","Photoshop"],a:1},
{q:"Veb-səhifələrin strukturunu yaratmaq üçün istifadə olunan işarələmə dili hansıdır?",o:["HTML","SQL","C++","Python","CSV"],a:0},
{q:"URL nədir?",o:["Fayl formatı","Veb-resursun ünvanı","Əməliyyat sistemi","Proqramlaşdırma dili","Antivirus"],a:1},
{q:"Excel-də düstur hansı simvolla başlayır?",o:["=","+","#","@","$"],a:0},
{q:"Verilənlər bazasına sorğular yazmaq üçün hansı dildən istifadə olunur?",o:["SQL","HTML","CSS","XML","JPEG"],a:0},
{q:"Hansı fayl uzantısı şəkil faylına aiddir?",o:[".docx",".jpg",".xlsx",".mp3",".exe"],a:1},
{q:"LAN hansı şəbəkə növüdür?",o:["Qlobal şəbəkə","Lokal şəbəkə","Peyk şəbəkəsi","Mobil şəbəkə","Regional şəbəkə"],a:1},
{q:"Kompüter virusu nədir?",o:["Qurğunun nasazlığı","Özünü çoxaldan zərərli proqram","Əməliyyat sisteminin yeniləməsi","Arxivləşdirmə proqramı","Brauzer əlavəsi"],a:1},
{q:"İkilik say sistemində hansı rəqəmlərdən istifadə olunur?",o:["0 və 1","0-dan 9-a qədər","1 və 2","0-dan 7-yə qədər","0-dan F-ə qədər"],a:0}]},
{id:"mikro",name:"Mikroiqtisadiyyat (əsaslar)",tag:"Hazır test",qs:[

// ---------- shared catalog (db capability; local fallback) ----------
const Cat={db:null,user:null,canWrite:null,metas:[],ready:false,unsub:null,listeners:[],
  async init(){
    try{ if(!window.claude||!claude.use) throw 0;
      this.db=await claude.use('db'); this.user=await claude.use('user');
      if(this.user){ try{this.canWrite=await this.user.can('data.write')}catch(e){} try{this.isOwner=!!(await this.user.isOwner())}catch(e){} }
      if(this.db) this.subscribe();
    }catch(e){}
    if(!this.db){ await this.loadStatic(); this.ready=true; this.emit() }
  },
  async loadStatic(){
    try{ const r=await fetch('data/catalog.json',{cache:'no-cache'}); if(r.ok){ const j=await r.json(); this.metas=(j.banks||[]).filter(m=>!m.hidden); this.static=true } }catch(e){}
  },
  subscribe(){
    let timer=setTimeout(()=>{this.ready=true;this.stale=true;this.emit()},10000);
    this.unsub=this.db.collection('banks').orderBy('createdAt','desc').limit(1000).onSnapshot(s=>{
      if(!s.metadata.fromCache){clearTimeout(timer);this.stale=false}
      this.metas=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>!m.hidden); this.ready=true; this.emit();
    },e=>{clearTimeout(timer);this.ready=true;this.err=e.code;this.emit()});
  },
  on(f){this.listeners.push(f)}, emit(){this.listeners.forEach(f=>{try{f()}catch(e){}})},
  async publish(b){
    if(!this.db) throw {code:'no_db'};
    const id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const chunks=[]; const per=150; for(let i=0;i<b.qs.length;i+=per) chunks.push(b.qs.slice(i,i+per));
    for(let k=0;k<chunks.length;k++){ await this.db.doc(`bankdata/${id}/parts/p${k}`).set({qs:chunks[k]}); }
    await this.db.doc('banks/'+id).set({name:b.name,uni:b.uni,uniLabel:b.uniLabel,fac:b.fac,subj:b.subj,lang:b.lang,count:b.qs.length,parts:chunks.length,createdAt:Date.now()});
    return id;
  },
  async loadQs(meta){
    if(this.static){ const r=await fetch('data/banks/'+meta.id+'.json'); return r.ok?((await r.json()).qs||[]):[] }
    const out=[]; for(let k=0;k<(meta.parts||0);k++){const s=await this.db.doc(`bankdata/${meta.id}/parts/p${k}`).get(); if(s.exists) out.push(...(s.data().qs||[]))} return out;
  },
  async report(id,reason){ if(!this.db) return; await this.db.collection('reports').add({bank:id,reason:reason||'',at:Date.now()}) },
  async remove(id){ await this.db.doc('banks/'+id).update({hidden:true}) }
};

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function pdfText(buf){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf}).promise; let out=[];
  for(let p=1;p<=doc.numPages;p++){
    $('status').textContent=t('reading_pdf',p,doc.numPages);
    const tc=await (await doc.getPage(p)).getTextContent();
    let lines=[],cur='',lastY=null;
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(lastY!==null && Math.abs(y-lastY)>2){lines.push(cur);cur=''}
      cur+=(cur&&!cur.endsWith(' ')&&!it.str.startsWith(' ')?' ':'')+it.str; lastY=y;
      if(it.hasEOL){lines.push(cur);cur='';lastY=null}
    }
    if(cur)lines.push(cur); out.push(...lines);
  }
  return out.join('\n');
}
async function docxText(buf){
  if(!window.mammoth){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');}

}

    if(/\.pdf$/i.test(f.name)) text=await pdfText(buf);
    else if(/\.docx$/i.test(f.name)) text=await docxText(buf);
    else text=new TextDecoder().decode(buf);

  }catch(e){$('status').textContent=t('read_fail')}
}

function pick(j){
  const x=curBank.qs[Q.ids[Q.i]];
  if(Q.mode==='practice'&&Q.picked!==null)return;
  Q.picked=j;
  $('qzOpts').querySelectorAll('.opt').forEach(b=>{const bj=+b.dataset.j;b.classList.remove('sel');
    if(Q.mode==='practice'){b.disabled=true;if(bj===x.a)b.classList.add('ok');else if(bj===j)b.classList.add('bad')}
    else if(bj===j)b.classList.add('sel')});
  $('qzNext').disabled=false;
}
function next(){ if(Q.picked===null)return; Q.answers[Q.i]=Q.picked; if(Q.i<Q.ids.length-1){Q.i++;renderQ()}else finish(); }
$('qzNext').onclick=next;
$('qzStop').onclick=()=>{if(Q.picked!==null)Q.answers[Q.i]=Q.picked;finish(true)};
document.addEventListener('keydown',e=>{
  if($('v-quiz').classList.contains('hide'))return;
  if(e.key==='Enter'){next();return}
  const n=+e.key; if(n>=1&&n<=Q.order.length)pick(Q.order[n-1]);
});
function finish(early){
  clearInterval(tick);
  const done=Q.answers.length; let ok=0; const wrongIdx=[];
  Q.ids.forEach((qi,k)=>{ if(k>=done)return; const x=curBank.qs[qi]; if(Q.answers[k]===x.a)ok++; else wrongIdx.push(k)});
  const total=early?Math.max(done,1):Q.ids.length;
  const pct=Math.round(ok/total*100);
  const st=mem.stats[curBank.id]||{wrong:[]};
  const wrongSet=new Set(st.wrong||[]);
  Q.ids.forEach((qi,k)=>{if(k>=done)return; if(Q.answers[k]===curBank.qs[qi].a)wrongSet.delete(qi);else wrongSet.add(qi)});
  st.wrong=[...wrongSet]; if(Q.mode==='exam'&&!early) st.best=Math.max(st.best||0,pct);
  mem.stats[curBank.id]=st; saveStats();
  const secs=Math.round((Date.now()-Q.start)/1000);
  $('rsScore').textContent=pct+'%';
  $('rsDetail').textContent=t('rs_detail',ok,total,Math.floor(secs/60),secs%60);
  $('rsList').innerHTML=wrongIdx.map(k=>{const x=curBank.qs[Q.ids[k]];return `<div class="mistake"><b>${esc(x.q)}</b><div class="note"><span class="y">${t('your_ans')}: ${esc(x.o[Q.answers[k]]??'—')}</span><br><span class="c">${t('correct')}: ${esc(x.o[x.a])}</span></div></div>`}).join('');
  $('rsListCard').classList.toggle('hide',!wrongIdx.length);
  $('rsMist').disabled=!st.wrong.length;
  show('result');
}
$('rsAgain').onclick=()=>startQuiz(Q.mode,shuffle(Q.ids),Q.minPerQ);
$('rsMist').onclick=()=>startQuiz('practice',shuffle((mem.stats[curBank.id]||{}).wrong||[]));
$('rsBack').onclick=()=>curBank.shared?go('b-'+curBank.id):openBank(curBank.id);

applyI18n(); route(); Cat.init();
</script>
</body>
</html>
