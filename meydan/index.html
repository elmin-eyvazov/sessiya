<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meydan — tələbə futbolu</title>
<meta name="description" content="Azərbaycan tələbələri üçün futbol: oyunçu və rəqib axtar, meydança və vaxtı razılaşdır, universitetlər cədvəli.">
<meta name="theme-color" content="#0f3d2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Meydan — tələbə futbolu">
<meta property="og:description" content="Oyun tap, komanda yığ, rəqib çağır.">
<meta property="og:image" content="icons/og.jpg">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14201a;--mute:#66756c;--line:#dfe6e1;--acc:#16a34a;--acc2:#e6f6ec;--acc3:#0f3d2a;--warn:#f59e0b;--bad:#dc2626;--badbg:#fdecec;--soft:#f6f9f7;--chip:#e9efeb}
[data-theme=dark]{--bg:#0c1210;--card:#151d19;--ink:#e6ede9;--mute:#94a39a;--line:#26322c;--acc:#22c55e;--acc2:#11291c;--soft:#1a241f;--chip:#22302a;--badbg:#3a1517}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(4px + env(safe-area-inset-top))}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--acc3);display:grid;place-items:center;font-style:normal;font-size:17px}
.lang{display:flex;background:var(--chip);border-radius:10px;padding:2px}.lang button{border:0;background:none;color:var(--mute);font:600 12px Inter,sans-serif;padding:6px 8px;border-radius:8px;cursor:pointer}.lang button.on{background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.4px}h2{font-size:18px;margin:0 0 10px}
.note{color:var(--mute);font-size:13px}.muted{color:var(--mute)}
.hero{background:linear-gradient(135deg,#0f3d2a,#16a34a);color:#fff;border:0;position:relative;overflow:hidden}
.hero .note{color:#d7f5e2}.hero:after{content:"⚽";position:absolute;right:-14px;bottom:-26px;font-size:120px;opacity:.15}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font:600 15px Inter,sans-serif;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--chip);color:var(--ink)}.btn.ghost{background:none;color:var(--acc);padding:8px}.btn.small{padding:7px 12px;font-size:13px}.btn.danger{background:var(--badbg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc3);border-color:var(--acc3);color:#fff}
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);font:14px Inter,sans-serif}
.seg button b{display:block;font-size:15px;margin-bottom:2px}.seg button.on{border-color:var(--acc);background:var(--acc2);box-shadow:0 0 0 1px var(--acc) inset}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px Inter,sans-serif;cursor:pointer}.pills button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.game{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer}
.game:hover{border-color:#b9cbbf}
.gtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip);color:var(--ink)}
.tag.p{background:var(--acc2);color:var(--acc)}.tag.o{background:#fff3db;color:#b45309}[data-theme=dark] .tag.o{background:#3a2a0d;color:#fbbf24}
.tag.x{background:var(--badbg);color:var(--bad)}.tag.d{background:var(--chip);color:var(--mute)}
.gt{font-size:17px;font-weight:800;margin:8px 0 2px}.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);font-size:13px}
.bar{height:7px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--acc)}
.who{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.who:first-child{border-top:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--acc3)}
.who .n{font-weight:700}.who .s{font-size:12.5px;color:var(--mute)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:8px 0}
.vs .t{font-weight:800;font-size:16px}.vs .sc{font-size:30px;font-weight:800}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);text-decoration:none;cursor:pointer}
nav.tabs a span{font-size:20px;line-height:1}nav.tabs a.on{color:var(--acc)}
nav.tabs a.plus span{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 18px rgba(22,163,74,.4)}
.hide{display:none!important}
.empty{padding:26px 10px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-weight:600;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1px}
table.lb{width:100%;border-collapse:collapse;font-size:14px}table.lb td,table.lb th{padding:7px 6px;text-align:right;border-top:1px solid var(--line)}table.lb td:first-child,table.lb th:first-child{text-align:left}table.lb th{color:var(--mute);font-weight:600;border-top:0}
.pitch{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--card)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.modal .sheet{border-radius:20px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}.kv b{color:var(--mute);font-weight:600}
.stat{flex:1;background:var(--soft);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:10px 0 20px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#home"><i>⚽</i>Meydan</a>
    <div class="row" style="gap:6px"><button class="btn ghost small" id="themeBtn" aria-label="theme">🌓</button><div class="lang" id="lang"><button data-l="az">AZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div></div>
  </header>
  <main id="view"></main>
  <footer><a href="#about" data-i="about"></a> · <span id="installLink"></span><div style="margin-top:6px">© Meydan · <span data-i="tagline"></span></div></footer>
</div>
<nav class="tabs">
  <a href="#home" data-n="home"><span>🏟️</span><b data-i="nav_games"></b></a>
  <a href="#pitches" data-n="pitches"><span>📍</span><b data-i="nav_pitches"></b></a>
  <a href="#new" data-n="new" class="plus"><span>+</span><b data-i="new_game"></b></a>
  <a href="#players" data-n="players"><span>👥</span><b data-i="nav_players"></b></a>
  <a href="#me" data-n="me"><span>👤</span><b data-i="nav_me"></b></a>
</nav>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
